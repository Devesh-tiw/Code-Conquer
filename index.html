<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DSA Master Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F7F8FA;
            --surface: #FFFFFF;
            --border: #E4E7EC;
            --ink: #0F1420;
            --ink-2: #4B5565;
            --ink-3: #8A94A6;
            --accent: #1D4ED8;
            --accent-soft: #EEF2FF;
            --success: #15803D;
            --streak: #C2410C;
            --code-bg: #0F172A;
            --code-text: #E2E8F0;
            --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.55;
            color: var(--ink-2)
        }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 42px 22px 70px
        }

        header {
            padding: 10px 0 28px
        }

        .eyebrow {
            color: var(--accent);
            font-family: var(--font-mono);
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-size: 12px
        }

        h1 {
            font-family: var(--font-mono);
            font-size: clamp(1.8rem, 3.4vw, 2.4rem);
            font-weight: 600;
            line-height: 1.15;
            margin: 10px 0 12px;
            letter-spacing: -.01em;
            color: var(--ink)
        }

        .tagline {
            max-width: 560px;
            color: var(--ink-2);
            font-size: 16px
        }

        .stats-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin: 28px 0 18px
        }

        .stat-card,
        .topic-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(16, 20, 32, .04)
        }

        .stat-card {
            padding: 14px 18px
        }

        .stat-label {
            display: block;
            font-family: var(--font-mono);
            color: var(--ink-3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .07em
        }

        .stat-value {
            display: block;
            font-family: var(--font-mono);
            font-size: 22px;
            font-weight: 600;
            color: var(--ink);
            margin-top: 6px
        }

        .streak .stat-value {
            color: var(--streak)
        }

        .progress-container {
            height: 8px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 10px
        }

        .progress-container div {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width .3s
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .controls-row input {
            flex: 1;
            min-width: 240px;
            font-family: var(--font-sans);
            font-size: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink);
            padding: 11px 14px;
            border-radius: 6px;
            outline: 0
        }

        .controls-row input:focus {
            border-color: var(--accent)
        }

        button {
            font: inherit
        }

        .btn-ghost {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--surface);
            color: var(--ink-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            transition: border-color 150ms, color 150ms
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        #no-results {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--ink-3)
        }

        .topic-section {
            margin: 16px 0;
            overflow: hidden
        }

        .topic-title {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 16px;
            margin: 0;
            padding: 16px 20px;
            background: var(--surface);
            color: var(--ink);
            border-bottom: 1px solid var(--border)
        }

        .problem-row {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border)
        }

        .problem-row:last-of-type {
            border-bottom: 0
        }

        .problem-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1
        }

        .problem-name {
            border: 0;
            background: none;
            color: var(--ink);
            font-family: var(--font-sans);
            font-weight: 600;
            text-align: left;
            padding: 0;
            cursor: pointer;
            font-size: 15px;
            transition: color 150ms
        }

        .problem-name:hover {
            color: var(--accent)
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            text-decoration: none;
            border: none;
            border-radius: 99px;
            padding: 3px 10px;
            white-space: nowrap;
            transition: background 150ms, color 150ms
        }

        .tag:hover {
            background: var(--accent);
            color: #fff
        }

        .custom-checkbox {
            appearance: none;
            width: 19px;
            height: 19px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 5px;
            display: grid;
            place-content: center;
            cursor: pointer;
            flex: none;
            transition: border-color 150ms
        }

        .custom-checkbox:checked {
            background: var(--success);
            border-color: var(--success)
        }

        .custom-checkbox:checked:after {
            content: '✓';
            color: #fff;
            font-weight: 700;
            font-size: 13px
        }

        .problem-row.done .problem-name {
            text-decoration: line-through;
            color: var(--ink-3)
        }

        .solution-section {
            display: none;
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 20px 24px 24px
        }

        .solution-section.open {
            display: block;
            animation: fadeIn 200ms ease
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .solution-section.open {
                animation: none
            }
        }

        .solution-section h3 {
            color: var(--ink-3);
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin: 16px 0 8px
        }

        .solution-section h3:first-child {
            margin-top: 0
        }

        .explanation {
            color: var(--ink-2);
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 6px 6px 0;
            padding: 14px 16px;
            margin: 0 0 16px;
            font-size: 14px;
            white-space: pre-line
        }

        .meta {
            font-family: var(--font-mono);
            color: var(--ink-3);
            font-size: 12px;
            margin-bottom: 16px
        }

        .meta b {
            color: var(--ink-2)
        }

        .code-block {
            margin: 0 0 4px;
            background: var(--code-bg);
            border: none;
            border-radius: 6px;
            overflow: auto;
            padding: 16px;
            color: var(--code-text);
            font: 13px/1.6 var(--font-mono)
        }

        footer {
            text-align: center;
            color: var(--ink-3);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 24px 20px;
            border-top: 1px solid var(--border);
            margin-top: 20px
        }

        .hidden {
            display: none !important
        }

        @media(max-width:650px) {
            .stats-row {
                grid-template-columns: 1fr 1fr
            }

            .progress {
                grid-column: 1/-1
            }

            .problem-info {
                display: block
            }

            .tag {
                margin-left: 7px
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <p class="eyebrow">DSA Preparation</p>
            <h1>DSA Master Tracker</h1>
            <p class="tagline">Master the core patterns. Read the explanation, review the Python solution, and track
                your progress — one problem at a time.</p>
            <div class="stats-row">
                <div class="stat-card progress"><span class="stat-label">Progress</span><span class="stat-value"
                        id="progress-text">0 / 0</span>
                    <div class="progress-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>
                <div class="stat-card streak"><span class="stat-label">Current Streak</span><span class="stat-value"
                        id="streak-current">0</span></div>
                <div class="stat-card"><span class="stat-label">Best Streak</span><span class="stat-value"
                        id="streak-best">0</span></div>
            </div>
            <div class="controls-row"><input id="search-input" placeholder="Search a problem by name…"
                    aria-label="Search problems"><button class="btn-ghost" id="expand-all">Expand all</button><button
                    class="btn-ghost" id="collapse-all">Collapse all</button></div>
            <p id="no-results" class="hidden">No problems match your search.</p>
        </header>
        <div id="app"></div>
    </main>
    <footer>Created and maintained by Devesh Tiwari.</footer>
    <script>
        const topics = [
            ['Arrays & Hashing', ['Contains Duplicate', 'Valid Anagram', 'Two Sum', 'Group Anagrams', 'Top K Frequent Elements']],
            ['Two Pointers', ['Valid Palindrome', 'Two Sum II', '3Sum', 'Container With Most Water', 'Trapping Rain Water']],
            ['Sliding Window', ['Best Time to Buy and Sell Stock', 'Longest Substring Without Repeating Characters', 'Longest Repeating Character Replacement', 'Permutation in String', 'Minimum Window Substring']],
            ['Stack', ['Valid Parentheses', 'Min Stack', 'Evaluate Reverse Polish Notation', 'Generate Parentheses', 'Daily Temperatures']],
            ['Binary Search', ['Binary Search', 'Search a 2D Matrix', 'Koko Eating Bananas', 'Find Minimum in Rotated Sorted Array', 'Search in Rotated Sorted Array']],
            ['Linked List', ['Reverse Linked List', 'Merge Two Sorted Lists', 'Reorder List', 'Remove Nth Node From End of List', 'Linked List Cycle']],
            ['Trees', ['Invert Binary Tree', 'Maximum Depth of Binary Tree', 'Diameter of Binary Tree', 'Balanced Binary Tree', 'Same Tree']],
            ['Graphs', ['Number of Islands', 'Clone Graph', 'Max Area of Island', 'Pacific Atlantic Water Flow', 'Course Schedule']],
            ['1D Dynamic Programming', ['Climbing Stairs', 'Min Cost Climbing Stairs', 'House Robber', 'House Robber II', 'Longest Palindromic Substring']],
            ['Heap & Priority Queue', ['Kth Largest Element in a Stream', 'Last Stone Weight', 'K Closest Points to Origin', 'Kth Largest Element in an Array', 'Task Scheduler']],
            ['Backtracking', ['Subsets', 'Combination Sum', 'Permutations', 'Subsets II', 'Word Search']],
            ['Tries', ['Implement Trie (Prefix Tree)', 'Design Add and Search Words Data Structure', 'Word Search II', 'Replace Words', 'Maximum XOR of Two Numbers in an Array']],
            ['Advanced Graphs', ['Reconstruct Itinerary', 'Min Cost to Connect All Points', 'Network Delay Time', 'Swim in Rising Water', 'Cheapest Flights Within K Stops']],
            ['2D Dynamic Programming', ['Unique Paths', 'Longest Common Subsequence', 'Best Time to Buy and Sell Stock with Cooldown', 'Coin Change II', 'Target Sum']],
            ['Greedy', ['Maximum Subarray', 'Jump Game', 'Jump Game II', 'Gas Station', 'Hand of Straights']],
            ['Intervals', ['Insert Interval', 'Merge Intervals', 'Non-overlapping Intervals', 'Meeting Rooms (LintCode)', 'Meeting Rooms II (LintCode)']],
            ['Math & Geometry', ['Rotate Image', 'Spiral Matrix', 'Set Matrix Zeroes', 'Happy Number', 'Plus One']],
            ['Bit Manipulation', ['Single Number', 'Number of 1 Bits', 'Counting Bits', 'Reverse Bits', 'Missing Number']],
            ['Union Find / Disjoint Set', ['Redundant Connection', 'Number of Connected Components (LintCode)', 'Graph Valid Tree (LintCode)', 'Accounts Merge', 'Number of Provinces']],
            ['Topological Sort', ['Course Schedule II', 'Alien Dictionary (LintCode)', 'Minimum Height Trees', 'Find Eventual Safe States', 'Sequence Reconstruction (LintCode)']],
            ['Prefix Sum', ['Range Sum Query - Immutable', 'Subarray Sum Equals K', 'Find Pivot Index', 'Contiguous Array', 'Product of Array Except Self']],
            ['String Manipulation', ['Palindromic Substrings', 'Decode String', 'Find All Anagrams in a String', 'Longest Common Prefix', 'Isomorphic Strings']],
            ['Design', ['LRU Cache', 'Design Twitter', 'Insert Delete GetRandom O(1)', 'Design Underground System', 'Time Based Key-Value Store']],
            ['Matrix', ['Valid Sudoku', 'Game of Life', 'Maximal Square', 'Surrounded Regions', 'Set Matrix Zeroes']],
            ['Monotonic Stack', ['Next Greater Element I', 'Next Greater Element II', 'Largest Rectangle in Histogram', 'Maximal Rectangle', 'Remove K Digits']],
            ['Binary Search Tree (BST)', ['Validate Binary Search Tree', 'Kth Smallest Element in a BST', 'Construct Tree from Preorder and Inorder Traversal', 'Binary Search Tree Iterator', 'Delete Node in a BST']],
            ['Advanced Math', ['Pow(x, n)', 'Multiply Strings', 'Integer to English Words', 'Excel Sheet Column Number', 'Roman to Integer']],
            ['Graph Traversal', ['Word Ladder', 'Shortest Path in Binary Matrix', 'Rotting Oranges', 'Snakes and Ladders', 'Open the Lock']],
            ['DP Sequences', ['Word Break', 'Longest Increasing Subsequence', 'Edit Distance', 'Regular Expression Matching', 'Wildcard Matching']],
            ['Advanced Data Structures', ['Sliding Window Maximum', 'Find Median from Data Stream', 'Merge k Sorted Lists', 'Range Sum Query - Mutable', 'Prefix and Suffix Search']],
            ['Sorting Algorithms', ['Sort an Array', 'Sort Colors', 'Wiggle Sort (LintCode)', 'Largest Number', 'Maximum Gap']],
            ['Shortest Path', ['Path with Maximum Probability', 'Find the City With the Smallest Number of Neighbors', 'Minimum Obstacle Removal to Reach Corner', 'Path With Minimum Effort', 'Second Minimum Time to Reach Destination']],
            ['Segment & Fenwick Trees', ['Count of Smaller Numbers After Self', 'Reverse Pairs', 'Falling Squares', 'Range Module', 'The Skyline Problem']],
            ['String Matching', ['Find the Index of the First Occurrence', 'Shortest Palindrome', 'Repeated String Match', 'Longest Happy Prefix', 'Distinct Subsequences']],
            ['Miscellaneous & Cache', ['Nim Game', 'Bulb Switcher', '132 Pattern', 'Find All Duplicates in an Array', 'LFU Cache']]
        ];
        const custom = {
            'Contains Duplicate': ['Track values in a set. If a value is already present, a duplicate exists.', 'def containsDuplicate(nums):\n    seen = set()\n    for x in nums:\n        if x in seen: return True\n        seen.add(x)\n    return False', 'O(n) time · O(n) space'],
            'Valid Anagram': ['Two strings are anagrams exactly when their character-frequency maps are equal.', 'from collections import Counter\ndef isAnagram(s, t):\n    return Counter(s) == Counter(t)', 'O(n) time · O(k) space'],
            'Two Sum': ['Store each number’s index. For x, look for target - x before inserting x.', 'def twoSum(nums, target):\n    pos = {}\n    for i, x in enumerate(nums):\n        if target - x in pos: return [pos[target-x], i]\n        pos[x] = i', 'O(n) time · O(n) space'],
            'Group Anagrams': ['Use the 26-character frequency tuple as a canonical key; words with the same key belong together.', 'from collections import defaultdict\ndef groupAnagrams(strs):\n    groups = defaultdict(list)\n    for s in strs:\n        key = tuple(s.count(chr(97+i)) for i in range(26))\n        groups[key].append(s)\n    return list(groups.values())', 'O(n·m) time · O(n) space'],
            'Top K Frequent Elements': ['Count frequencies and keep the k most frequent values with buckets indexed by frequency.', 'from collections import Counter\ndef topKFrequent(nums, k):\n    buckets = [[] for _ in range(len(nums)+1)]\n    for x, f in Counter(nums).items(): buckets[f].append(x)\n    out=[]\n    for f in range(len(buckets)-1,0,-1):\n        out += buckets[f]\n        if len(out) >= k: return out[:k]', 'O(n) time · O(n) space'],
            'Valid Palindrome': ['Use two pointers, skip non-alphanumeric characters, and compare lowercase characters.', 'def isPalindrome(s):\n    s = "".join(c.lower() for c in s if c.isalnum())\n    return s == s[::-1]', 'O(n) time · O(n) space'],
            'Best Time to Buy and Sell Stock': ['Maintain the cheapest price seen so far and the best profit obtainable by selling today.', 'def maxProfit(prices):\n    low, best = float("inf"), 0\n    for p in prices:\n        low = min(low, p); best = max(best, p-low)\n    return best', 'O(n) time · O(1) space'],
            'Longest Substring Without Repeating Characters': ['A sliding window is valid when its characters are unique; move left past a repeated character.', 'def lengthOfLongestSubstring(s):\n    last={}; left=best=0\n    for right,c in enumerate(s):\n        if c in last: left=max(left,last[c]+1)\n        last[c]=right; best=max(best,right-left+1)\n    return best', 'O(n) time · O(k) space'],
            'Minimum Window Substring': ['Expand the right edge until all required characters are covered, then shrink from the left while valid.', 'from collections import Counter\ndef minWindow(s,t):\n    need=Counter(t); missing=len(t); left=best=(0,float("inf"))\n    for right,c in enumerate(s):\n        if need[c]>0: missing-=1\n        need[c]-=1\n        while missing==0:\n            if right-left < best[1]-best[0]: best=(left,right)\n            need[s[left]]+=1\n            if need[s[left]]>0: missing+=1\n            left+=1\n    return "" if best[1]==float("inf") else s[best[0]:best[1]+1]', 'O(n) time · O(k) space'],
            'Valid Parentheses': ['Push opening brackets; every closing bracket must match the most recent opening bracket.', 'def isValid(s):\n    stack=[]; pairs={")":"(", "]":"[", "}":"{"}\n    for c in s:\n        if c in "([{": stack.append(c)\n        elif not stack or stack.pop()!=pairs[c]: return False\n    return not stack', 'O(n) time · O(n) space'],
            'Binary Search': ['Maintain an inclusive search interval and discard the half that cannot contain the target.', 'def search(nums,target):\n    lo,hi=0,len(nums)-1\n    while lo<=hi:\n        mid=(lo+hi)//2\n        if nums[mid]==target:return mid\n        if nums[mid]<target:lo=mid+1\n        else:hi=mid-1\n    return -1', 'O(log n) time · O(1) space'],
            'Reverse Linked List': ['Rewire each node’s next pointer to the previous node while walking forward.', 'def reverseList(head):\n    prev=None\n    while head:\n        nxt=head.next; head.next=prev; prev=head; head=nxt\n    return prev', 'O(n) time · O(1) space'],
            'Maximum Depth of Binary Tree': ['The depth is one plus the larger depth of the two children; an empty tree has depth zero.', 'def maxDepth(root):\n    if not root:return 0\n    return 1+max(maxDepth(root.left),maxDepth(root.right))', 'O(n) time · O(h) stack'],
            'Number of Islands': ['Whenever an unvisited land cell is found, flood-fill its island and count one component.', 'def numIslands(grid):\n    R,C=len(grid),len(grid[0]); count=0\n    def dfs(r,c):\n        if r<0 or c<0 or r>=R or c>=C or grid[r][c]!="1":return\n        grid[r][c]="0"\n        for dr,dc in ((1,0),(-1,0),(0,1),(0,-1)): dfs(r+dr,c+dc)\n    for r in range(R):\n        for c in range(C):\n            if grid[r][c]=="1": count+=1; dfs(r,c)\n    return count', 'O(RC) time · O(RC) worst-case space'],
            'Course Schedule': ['Build prerequisite edges and repeatedly remove zero-indegree courses. A cycle means not all courses can be removed.', 'from collections import defaultdict,deque\ndef canFinish(n, prerequisites):\n    g=defaultdict(list); indeg=[0]*n\n    for a,b in prerequisites:g[b].append(a); indeg[a]+=1\n    q=deque(i for i,x in enumerate(indeg) if x==0); done=0\n    while q:\n        u=q.popleft(); done+=1\n        for v in g[u]:\n            indeg[v]-=1\n            if indeg[v]==0:q.append(v)\n    return done==n', 'O(V+E) time · O(V+E) space'],
            'Climbing Stairs': ['The last step is reached from n-1 or n-2, giving the Fibonacci recurrence.', 'def climbStairs(n):\n    a,b=1,1\n    for _ in range(n): a,b=b,a+b\n    return a', 'O(n) time · O(1) space'],
            'House Robber': ['For each house choose rob it plus dp[i-2], or skip it and keep dp[i-1].', 'def rob(nums):\n    skip=take=0\n    for x in nums: skip,take=take,max(take,skip+x)\n    return take', 'O(n) time · O(1) space'],
            'Maximum Subarray': ['Kadane’s algorithm keeps the best subarray ending at the current position.', 'def maxSubArray(nums):\n    cur=best=nums[0]\n    for x in nums[1:]: cur=max(x,cur+x); best=max(best,cur)\n    return best', 'O(n) time · O(1) space'],
            'Single Number': ['XOR cancels equal pairs because x XOR x is zero and zero XOR y is y.', 'def singleNumber(nums):\n    ans=0\n    for x in nums: ans ^= x\n    return ans', 'O(n) time · O(1) space'],
            'Product of Array Except Self': ['Build prefix products from the left and multiply by suffix products accumulated from the right.', 'def productExceptSelf(nums):\n    out=[1]*len(nums); p=1\n    for i,x in enumerate(nums): out[i]=p; p*=x\n    p=1\n    for i in range(len(nums)-1,-1,-1): out[i]*=p; p*=nums[i]\n    return out', 'O(n) time · O(1) extra space'],
            'Invert Binary Tree': ['Swap the children at every node recursively or with a queue.', 'def invertTree(root):\n    if root:\n        root.left,root.right=invertTree(root.right),invertTree(root.left)\n    return root', 'O(n) time · O(h) stack'],
        };
        const more = {
            'Container With Most Water': ['Start at both ends. The shorter wall limits area, so move that pointer inward after updating the maximum.', 'def maxArea(h):\n    l,r,best=0,len(h)-1,0\n    while l<r:\n        best=max(best,(r-l)*min(h[l],h[r]))\n        if h[l]<h[r]: l+=1\n        else: r-=1\n    return best', 'O(n) time · O(1) space'],
            'Two Sum II': ['Because the array is sorted, increase the left pointer when the sum is too small and decrease the right pointer when too large.', 'def twoSum(numbers,target):\n    l,r=0,len(numbers)-1\n    while l<r:\n        s=numbers[l]+numbers[r]\n        if s==target:return [l+1,r+1]\n        if s<target:l+=1\n        else:r-=1', 'O(n) time · O(1) space'],
            '3Sum': ['Sort first, fix one value, then solve the remaining two-sum problem with two pointers while skipping duplicates.', 'def threeSum(nums):\n    nums.sort(); out=[]\n    for i in range(len(nums)-2):\n        if i and nums[i]==nums[i-1]:continue\n        l,r=i+1,len(nums)-1\n        while l<r:\n            s=nums[i]+nums[l]+nums[r]\n            if s==0:\n                out.append([nums[i],nums[l],nums[r]]); l+=1; r-=1\n                while l<r and nums[l]==nums[l-1]:l+=1\n                while l<r and nums[r]==nums[r+1]:r-=1\n            elif s<0:l+=1\n            else:r-=1\n    return out', 'O(n²) time · O(1) extra space'],
            'Daily Temperatures': ['Keep indices in a decreasing stack. A warmer temperature resolves all smaller temperatures on top.', 'def dailyTemperatures(t):\n    ans=[0]*len(t); st=[]\n    for i,x in enumerate(t):\n        while st and t[st[-1]]<x:\n            j=st.pop(); ans[j]=i-j\n        st.append(i)\n    return ans', 'O(n) time · O(n) space'],
            'Kth Largest Element in an Array': ['Maintain a min-heap of size k; its root is the kth largest value seen.', 'import heapq\ndef findKthLargest(nums,k):\n    h=[]\n    for x in nums:\n        heapq.heappush(h,x)\n        if len(h)>k:heapq.heappop(h)\n    return h[0]', 'O(n log k) time · O(k) space'],
            'Valid Anagram': ['Compare character counts; equal counts imply the same multiset of characters.', 'from collections import Counter\ndef isAnagram(s,t): return Counter(s)==Counter(t)', 'O(n) time · O(k) space'],
            'Jump Game': ['Scan left to right while tracking the furthest reachable index. If the current index exceeds it, the goal is unreachable.', 'def canJump(nums):\n    reach=0\n    for i,x in enumerate(nums):\n        if i>reach:return False\n        reach=max(reach,i+x)\n    return True', 'O(n) time · O(1) space'],
            'Plus One': ['Process digits from right to left. Stop when a digit does not carry; if all carry, prepend one.', 'def plusOne(digits):\n    for i in range(len(digits)-1,-1,-1):\n        if digits[i]<9:digits[i]+=1; return digits\n        digits[i]=0\n    return [1]+digits', 'O(n) time · O(1) extra space'],
            'Happy Number': ['Repeatedly replace n with the sum of squared digits. A set detects the non-happy cycle.', 'def isHappy(n):\n    seen=set()\n    while n!=1 and n not in seen:\n        seen.add(n); n=sum(int(c)**2 for c in str(n))\n    return n==1', 'O(log n) time · O(log n) space'],
            'Find Pivot Index': ['Maintain the left sum; the right sum is total minus left minus the current value.', 'def pivotIndex(nums):\n    total=sum(nums); left=0\n    for i,x in enumerate(nums):\n        if left==total-left-x:return i\n        left+=x\n    return -1', 'O(n) time · O(1) space'],
            'Longest Common Prefix': ['Shorten the candidate prefix until every string starts with it.', 'def longestCommonPrefix(strs):\n    if not strs:return ""\n    p=strs[0]\n    for s in strs[1:]:\n        while not s.startswith(p):p=p[:-1]\n    return p', 'O(total input) time · O(1) extra space'],
            'Isomorphic Strings': ['Maintain a bijection in both directions so two different characters cannot map to the same character.', 'def isIsomorphic(s,t):\n    a,b={},{}\n    for x,y in zip(s,t):\n        if (x in a and a[x]!=y) or (y in b and b[y]!=x):return False\n        a[x]=y; b[y]=x\n    return True', 'O(n) time · O(k) space']
        };
        Object.assign(custom, more);
        Object.assign(custom, {
            'Min Stack': ['Keep a second stack of the minimum value at every depth. The top of it is always the current minimum.', 'class MinStack:\n    def __init__(self): self.st=[]\n    def push(self,val): self.st.append((val,min(val,self.st[-1][1] if self.st else val)))\n    def pop(self): self.st.pop()\n    def top(self): return self.st[-1][0]\n    def getMin(self): return self.st[-1][1]', 'O(1) per operation · O(n) space'],
            'Evaluate Reverse Polish Notation': ['Numbers are pushed. An operator pops the right operand first, then the left operand, applies the operation, and pushes the result.', 'def evalRPN(tokens):\n    st=[]\n    for t in tokens:\n        if t in "+-*/":\n            b,a=st.pop(),st.pop()\n            v=a+b if t=="+" else a-b if t=="-" else a*b if t=="*" else int(a/b)\n            st.append(v)\n        else: st.append(int(t))\n    return st[-1]', 'O(n) time · O(n) space'],
            'Group Anagrams': ['Use a sorted word as a canonical key. All words with the same sorted characters are anagrams.', 'from collections import defaultdict\ndef groupAnagrams(strs):\n    d=defaultdict(list)\n    for word in strs:d[tuple(sorted(word))].append(word)\n    return list(d.values())', 'O(n·m log m) time · O(nm) space'],
            'Longest Repeating Character Replacement': ['The window is valid when window length minus its most frequent character count is at most k.', 'def characterReplacement(s,k):\n    count={}; left=best=0\n    for right,c in enumerate(s):\n        count[c]=count.get(c,0)+1\n        while right-left+1-max(count.values())>k:\n            count[s[left]]-=1; left+=1\n        best=max(best,right-left+1)\n    return best', 'O(n) time · O(26) space'],
            'Permutation in String': ['A fixed-size sliding window matches when its character counts equal the pattern counts.', 'from collections import Counter\ndef checkInclusion(s1,s2):\n    need=Counter(s1); win=Counter()\n    for i,c in enumerate(s2):\n        win[c]+=1\n        if i>=len(s1):\n            old=s2[i-len(s1)]; win[old]-=1\n            if not win[old]:del win[old]\n        if win==need:return True\n    return False', 'O(n) average time · O(k) space'],
            'Invert Binary Tree': ['At each node exchange left and right, then recursively invert both resulting subtrees.', 'def invertTree(root):\n    if root is None:return None\n    root.left,root.right=invertTree(root.right),invertTree(root.left)\n    return root', 'O(n) time · O(h) recursion'],
            'Find Minimum in Rotated Sorted Array': ['At mid, compare with the right boundary. If mid is larger, the minimum is to the right; otherwise keep mid.', 'def findMin(nums):\n    l,r=0,len(nums)-1\n    while l<r:\n        m=(l+r)//2\n        if nums[m]>nums[r]:l=m+1\n        else:r=m\n    return nums[l]', 'O(log n) time · O(1) space'],
            'Last Stone Weight': ['Use a max-heap (negated values), repeatedly smash the two heaviest stones, and push a remainder.', 'import heapq\ndef lastStoneWeight(stones):\n    h=[-x for x in stones]; heapq.heapify(h)\n    while len(h)>1:\n        a,b=-heapq.heappop(h),-heapq.heappop(h)\n        if a>b:heapq.heappush(h,-(a-b))\n    return -h[0] if h else 0', 'O(n log n) time · O(n) space'],
            'Counting Bits': ['Remove the lowest set bit: i & (i-1). The count is one plus the count of the remaining number.', 'def countBits(n):\n    dp=[0]*(n+1)\n    for i in range(1,n+1):dp[i]=dp[i&(i-1)]+1\n    return dp', 'O(n) time · O(n) space'],
            'Missing Number': ['XOR every index and every value. All paired numbers cancel, leaving the missing value.', 'def missingNumber(nums):\n    ans=len(nums)\n    for i,x in enumerate(nums):ans^=i^x\n    return ans', 'O(n) time · O(1) space']
        });
        function generic(name, topic) {
            const patterns = {
                'Arrays & Hashing': 'Use a hash map or set to store information already seen; this turns repeated searches into constant-time lookups.',
                'Two Pointers': 'Exploit ordering or opposite-direction movement. Move the pointer that can improve or repair the invariant.',
                'Sliding Window': 'Maintain a window satisfying the problem constraint, expand right, and shrink left whenever the constraint is violated.',
                'Stack': 'Use a stack to remember unresolved items; the newest item is the first one whose answer can become known.',
                'Binary Search': 'Define a monotonic predicate, search an inclusive range, and discard half the candidates after each comparison.',
                'Linked List': 'Use pointers carefully; keep the next node before rewiring links and use a dummy node for edge cases.',
                'Trees': 'Solve the same problem for each subtree and combine child results. Base case: an empty node.',
                'Graphs': 'Build adjacency lists and use BFS/DFS with a visited set so every vertex and edge is processed once.',
                '1D Dynamic Programming': 'Define dp[i] as the best answer for the first i positions, then derive it from smaller states.',
                'Heap & Priority Queue': 'Use a heap to repeatedly retrieve the smallest or largest currently available candidate.',
                'Backtracking': 'Choose a candidate, recurse, then undo the choice. Prune branches that cannot produce a valid answer.',
                'Tries': 'Store characters along root-to-leaf paths; each node represents a prefix and supports prefix queries efficiently.',
                'Advanced Graphs': 'Model the problem as a weighted graph and choose the appropriate greedy graph algorithm such as Dijkstra, Prim, or DFS.',
                '2D Dynamic Programming': 'Define dp for prefixes or grid cells and fill states from already solved neighboring states.',
                'Greedy': 'Choose the locally safe option while maintaining an invariant that proves no better future solution is lost.',
                'Intervals': 'Sort intervals by start or end, then merge or select them while maintaining the current active interval.',
                'Math & Geometry': 'Translate the geometric operation into index or arithmetic transformations and handle boundaries explicitly.',
                'Bit Manipulation': 'Use bitwise identities such as XOR cancellation, shifts, masks, or bit counts.',
                'Union Find / Disjoint Set': 'Use DSU with path compression and union by rank to maintain connected components.',
                'Topological Sort': 'Track indegrees, process zero-indegree nodes, and detect cycles when nodes remain unprocessed.',
                'Prefix Sum': 'Precompute cumulative values so a range or balance query becomes a constant-time difference or hash lookup.',
                'String Manipulation': 'Scan the string while maintaining the required counts, stack, or dynamic-programming state.',
                'Design': 'Separate the required operations into data structures whose invariants make each public operation efficient.',
                'Matrix': 'Traverse by rows, columns, layers, or connected cells while protecting boundaries and visited state.',
                'Monotonic Stack': 'Keep candidates monotonic; pop items as soon as the current value resolves their next greater/smaller answer.',
                'Binary Search Tree (BST)': 'Use the BST ordering invariant to prune one subtree at every comparison.',
                'Advanced Math': 'Reduce the operation using logarithmic exponentiation, positional representation, or digit arithmetic.',
                'Graph Traversal': 'Use BFS for minimum unweighted distance and DFS/BFS visited marking for reachability.',
                'DP Sequences': 'Define dp over prefixes of one or two sequences and choose match/skip/replace transitions.',
                'Advanced Data Structures': 'Combine the right structure—deque, heaps, linked lists, or indexed trees—to maintain the required invariant.',
                'Sorting Algorithms': 'Sort or partition the data, then scan the ordered result to answer the query.',
                'Shortest Path': 'Choose BFS for unit costs, 0-1 BFS for binary costs, or Dijkstra/Floyd-Warshall for weighted costs.',
                'Segment & Fenwick Trees': 'Coordinate-compress indices and use a tree structure for logarithmic range queries and updates.',
                'String Matching': 'Build a prefix-function/rolling hash or use a linear scan to locate repeated patterns efficiently.',
                'Miscellaneous & Cache': 'Look for a mathematical invariant or combine a hash map with an ordered structure for cache operations.'
            };
            const idea = patterns[topic] || 'Identify the invariant, choose a data structure that maintains it, and prove the transition preserves correctness.';
            return [`Core idea: ${idea}\n\nHow to approach ${name}:\n1. Write down the input invariant before coding.\n2. Choose the data structure suggested by the topic.\n3. Process each item once when possible.\n4. Check empty input, one item, duplicates, ties, and boundary indices.\n\nCorrectness check: after every loop iteration, the maintained data structure must represent exactly the part of the input already processed. The returned value is then read from that invariant.`, `# ${name}\n# This is an implementation checklist for the problem.\n# First write the LeetCode method signature from the prompt.\n# Maintain this invariant: ${idea}\n# Verify empty input, the smallest valid input, and duplicate/boundary cases.`, 'Study outline · add the exact prompt signature and test against the examples'];
        }
        const app = document.getElementById('app');
        const searchInput = document.getElementById('search-input'), noResults = document.getElementById('no-results'), expandAll = document.getElementById('expand-all'), collapseAll = document.getElementById('collapse-all');
        let number = 0, records = [];
        for (const [topic, names] of topics) { const section = document.createElement('section'); section.className = 'topic-section'; section.dataset.topic = topic; section.innerHTML = `<h2 class="topic-title">${++number}. ${topic}</h2>`; names.forEach(name => { const id = ++records.length, sol = 'sol-' + id; const [ex, code, meta] = custom[name] || generic(name, topic); const row = document.createElement('div'); row.className = 'problem-row'; row.dataset.name = name.toLowerCase(); row.innerHTML = `<input type="checkbox" class="custom-checkbox progress-cb" id="prob-${id}"><div class="problem-info"><button class="problem-name" type="button" aria-controls="${sol}">${id}. ${name}</button><a class="tag" target="_blank" rel="noopener" href="https://leetcode.com/problems/${name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}/">LeetCode</a></div>`; const answer = document.createElement('div'); answer.id = sol; answer.className = 'solution-section'; const safeCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;'); const safeEx = ex.replace(/&/g, '&amp;').replace(/</g, '&lt;'); answer.innerHTML = `<h3>Explanation & approach</h3><div class="explanation">${safeEx}</div><h3>Why this works</h3><div class="explanation">The solution maintains the invariant described above after every iteration. This prevents already-processed input from being reconsidered and handles the important boundary cases explicitly.</div><div class="meta"><b>Complexity:</b> ${meta}</div><h3>Python answer</h3><pre class="code-block"><code>${safeCode}</code></pre><h3>Before submitting</h3><div class="explanation">Trace the code on the smallest input, an empty or missing-value case when allowed, duplicate values, and the largest boundary. Then compare the result with the examples on the linked problem.</div>`; row.querySelector('.problem-name').onclick = () => answer.classList.toggle('open'); section.append(row, answer); app.append(section) }); }
        const boxes = [...document.querySelectorAll('.progress-cb')], key = 'dsa-master-progress-v2'; let saved = JSON.parse(localStorage.getItem(key) || '{}'); boxes.forEach(b => { b.checked = !!saved[b.id]; b.onchange = () => { saved[b.id] = b.checked; localStorage.setItem(key, JSON.stringify(saved)); update() } });
        function update() { const done = boxes.filter(x => x.checked).length; progressText.textContent = `${done} / ${boxes.length}`; progressBar.style.width = (done / boxes.length * 100) + '%'; boxes.forEach(b => b.closest('.problem-row').classList.toggle('done', b.checked)); let run = 0, best = 0; boxes.forEach(b => { run = b.checked ? run + 1 : 0; best = Math.max(best, run) }); streakCurrent.textContent = run; streakBest.textContent = best } const progressText = document.getElementById('progress-text'), progressBar = document.getElementById('progress-bar'), streakCurrent = document.getElementById('streak-current'), streakBest = document.getElementById('streak-best'); update();
        searchInput.oninput = () => { const q = searchInput.value.toLowerCase().trim(); let visible = 0; document.querySelectorAll('.topic-section').forEach(s => { let any = false; s.querySelectorAll('.problem-row').forEach(r => { const ok = !q || r.dataset.name.includes(q); r.classList.toggle('hidden', !ok); r.nextElementSibling.classList.toggle('hidden', !ok); if (ok) { any = true; visible++ } }); s.classList.toggle('hidden', !any) }); noResults.classList.toggle('hidden', visible !== 0) };
        expandAll.onclick = () => document.querySelectorAll('.solution-section:not(.hidden)').forEach(x => x.classList.add('open')); collapseAll.onclick = () => document.querySelectorAll('.solution-section').forEach(x => x.classList.remove('open'));
    </script>
