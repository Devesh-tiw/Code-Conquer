<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DSA Master Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F7F8FA;
            --surface: #FFFFFF;
            --border: #E4E7EC;
            --ink: #0F1420;
            --ink-2: #4B5565;
            --ink-3: #8A94A6;
            --accent: #1D4ED8;
            --accent-soft: #EEF2FF;
            --success: #15803D;
            --streak: #C2410C;
            --code-bg: #0F172A;
            --code-text: #E2E8F0;
            --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.55;
            color: var(--ink-2)
        }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 42px 22px 70px
        }

        header {
            padding: 10px 0 28px
        }

        .eyebrow {
            color: var(--accent);
            font-family: var(--font-mono);
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-size: 12px
        }

        h1 {
            font-family: var(--font-mono);
            font-size: clamp(1.8rem, 3.4vw, 2.4rem);
            font-weight: 600;
            line-height: 1.15;
            margin: 10px 0 12px;
            letter-spacing: -.01em;
            color: var(--ink)
        }

        .tagline {
            max-width: 560px;
            color: var(--ink-2);
            font-size: 16px
        }

        .stats-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin: 28px 0 18px
        }

        .stat-card,
        .topic-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(16, 20, 32, .04)
        }

        .stat-card {
            padding: 14px 18px
        }

        .stat-label {
            display: block;
            font-family: var(--font-mono);
            color: var(--ink-3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .07em
        }

        .stat-value {
            display: block;
            font-family: var(--font-mono);
            font-size: 22px;
            font-weight: 600;
            color: var(--ink);
            margin-top: 6px
        }

        .streak .stat-value {
            color: var(--streak)
        }

        .progress-container {
            height: 8px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 10px
        }

        .progress-container div {
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width .3s
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .controls-row input {
            flex: 1;
            min-width: 240px;
            font-family: var(--font-sans);
            font-size: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink);
            padding: 11px 14px;
            border-radius: 6px;
            outline: 0
        }

        .controls-row input:focus {
            border-color: var(--accent)
        }

        button {
            font: inherit
        }

        .btn-ghost {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--surface);
            color: var(--ink-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            transition: border-color 150ms, color 150ms
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        #no-results {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--ink-3)
        }

        .topic-section {
            margin: 16px 0;
            overflow: hidden
        }

        .topic-title {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 16px;
            margin: 0;
            padding: 16px 20px;
            background: var(--surface);
            color: var(--ink);
            border-bottom: 1px solid var(--border)
        }

        .problem-row {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border)
        }

        .problem-row:last-of-type {
            border-bottom: 0
        }

        .problem-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1
        }

        .problem-name {
            border: 0;
            background: none;
            color: var(--ink);
            font-family: var(--font-sans);
            font-weight: 600;
            text-align: left;
            padding: 0;
            cursor: pointer;
            font-size: 15px;
            transition: color 150ms
        }

        .problem-name:hover {
            color: var(--accent)
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            text-decoration: none;
            border: none;
            border-radius: 99px;
            padding: 3px 10px;
            white-space: nowrap;
            transition: background 150ms, color 150ms
        }

        .tag:hover {
            background: var(--accent);
            color: #fff
        }

        .custom-checkbox {
            appearance: none;
            width: 19px;
            height: 19px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 5px;
            display: grid;
            place-content: center;
            cursor: pointer;
            flex: none;
            transition: border-color 150ms
        }

        .custom-checkbox:checked {
            background: var(--success);
            border-color: var(--success)
        }

        .custom-checkbox:checked:after {
            content: '✓';
            color: #fff;
            font-weight: 700;
            font-size: 13px
        }

        .problem-row.done .problem-name {
            text-decoration: line-through;
            color: var(--ink-3)
        }

        .solution-section {
            display: none;
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 20px 24px 24px
        }

        .solution-section.open {
            display: block;
            animation: fadeIn 200ms ease
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .solution-section.open {
                animation: none
            }
        }

        .solution-section h3 {
            color: var(--ink-3);
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin: 16px 0 8px
        }

        .solution-section h3:first-child {
            margin-top: 0
        }

        .explanation {
            color: var(--ink-2);
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 0 6px 6px 0;
            padding: 14px 16px;
            margin: 0 0 16px;
            font-size: 14px;
            white-space: pre-line
        }

        .meta {
            font-family: var(--font-mono);
            color: var(--ink-3);
            font-size: 12px;
            margin-bottom: 16px
        }

        .meta b {
            color: var(--ink-2)
        }

        .code-block {
            margin: 0 0 4px;
            background: var(--code-bg);
            border: none;
            border-radius: 6px;
            overflow: auto;
            padding: 16px;
            color: var(--code-text);
            font: 13px/1.6 var(--font-mono)
        }

        footer {
            text-align: center;
            color: var(--ink-3);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 24px 20px;
            border-top: 1px solid var(--border);
            margin-top: 20px
        }

        .hidden {
            display: none !important
        }

        @media(max-width:650px) {
            .stats-row {
                grid-template-columns: 1fr 1fr
            }

            .progress {
                grid-column: 1/-1
            }

            .problem-info {
                display: block
            }

            .tag {
                margin-left: 7px
            }
        }
    </style>
    <style>
        /* ============ v2: sidebar, company filter, AI focus ============ */
        .topic-section {
            scroll-margin-top: 18px;
        }

        #sb-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 95;
            display: none;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            font-size: 19px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(16, 20, 32, .14);
        }

        #sb-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #sb-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 32, .42);
            z-index: 75;
        }

        #sidenav {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 274px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 80;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
        }

        #sidenav .sb-head {
            padding: 18px 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        #sidenav .sb-title {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 15px;
            color: var(--ink);
        }

        #sidenav .sb-title small {
            display: block;
            color: var(--ink-3);
            font-family: var(--font-mono);
            font-size: 10.5px;
            margin-top: 3px;
            line-height: 1.5;
        }

        #sidenav .sb-group-label {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-3);
            padding: 18px 16px 6px;
        }

        #sidenav .sb-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: calc(100% - 16px);
            margin: 0 8px;
            text-align: left;
            background: transparent;
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--ink-2);
            font-family: var(--font-sans);
            font-size: 13.5px;
            line-height: 1.35;
        }

        #sidenav .sb-btn:hover {
            background: var(--bg);
            color: var(--ink);
        }

        #sidenav .sb-btn.active {
            background: var(--bg);
            color: var(--accent);
            font-weight: 600;
        }

        #sidenav .sb-btn .emoji {
            width: 18px;
            flex: 0 0 18px;
        }

        #sidenav .sb-btn .cnt {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--ink-3);
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 1px 8px;
            border-radius: 99px;
            white-space: nowrap;
        }

        #sidenav .sb-btn.active .cnt {
            color: var(--accent);
            border-color: var(--accent);
        }

        #sidenav .sb-btn .label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sidenav .sb-foot {
            padding: 14px 16px 22px;
            color: var(--ink-3);
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.7;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        #filter-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 0 16px;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            background: var(--surface);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: var(--ink-2);
        }

        #filter-banner b {
            color: var(--accent);
        }

        #filter-banner .spacer {
            flex: 1;
        }

        #filter-banner .clear-filter {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink-2);
            border-radius: 7px;
            padding: 5px 12px;
            cursor: pointer;
        }

        #filter-banner .clear-filter:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (min-width: 1180px) {
            body {
                padding-left: 274px;
            }

            #sidenav {
                transform: none;
                box-shadow: none;
            }

            #sb-toggle,
            #sb-backdrop {
                display: none !important;
            }
        }

        @media (max-width: 1179px) {
            #sidenav {
                transform: translateX(-104%);
                transition: transform .22s ease;
                box-shadow: 0 10px 50px rgba(16, 20, 32, .3);
            }

            body.sb-open #sidenav {
                transform: none;
            }

            body.sb-open {
                overflow: hidden;
            }

            body.sb-open #sb-backdrop {
                display: block;
            }

            #sb-toggle {
                display: flex;
            }
        }
    </style>
    <style>
        /* ============ v3: Pattern cheat sheet view ============ */
        #cheat-view {
            display: none;
        }

        main.cheat-mode #app {
            display: none;
        }

        main.cheat-mode #cheat-view {
            display: block;
        }

        .cheat-hero {
            margin: 4px 0 20px;
            padding: 20px 22px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .cheat-hero h2 {
            margin: 0 0 6px;
            font-family: var(--font-mono);
            font-size: 1.35rem;
            font-weight: 600;
        }

        .cheat-hero p {
            margin: 0;
            color: var(--ink-2);
            font-size: 14px;
            max-width: 720px;
        }

        .cheat-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .cheat-group-title {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin: 26px 2px 10px;
        }

        details.cheat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin: 12px 0;
            overflow: hidden;
        }

        details.cheat-card>summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
            padding: 13px 18px;
            user-select: none;
        }

        details.cheat-card>summary::-webkit-details-marker {
            display: none;
        }

        details.cheat-card>summary:hover {
            background: var(--bg);
        }

        details.cheat-card>summary .cc-idx {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1px 7px;
        }

        details.cheat-card>summary .cc-t {
            font-family: var(--font-mono);
            font-size: 14.5px;
            font-weight: 600;
            color: var(--ink);
        }

        details.cheat-card>summary .cc-signal {
            flex-basis: 100%;
            color: var(--ink-3);
            font-size: 13px;
            line-height: 1.5;
            padding-left: 34px;
        }

        details.cheat-card>summary .cc-arrow {
            margin-left: auto;
            color: var(--ink-3);
            font-family: var(--font-mono);
        }

        details.cheat-card[open]>summary .cc-arrow {
            transform: rotate(180deg);
            display: inline-block;
        }

        .cc-body {
            border-top: 1px solid var(--border);
            padding: 16px 22px 18px;
            background: var(--bg);
        }

        .cc-body h4 {
            margin: 14px 0 6px;
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .cc-body h4:first-child {
            margin-top: 0;
        }

        .cc-body ol {
            margin: 0 0 4px;
            padding-left: 20px;
        }

        .cc-body li {
            color: var(--ink-2);
            font-size: 13.8px;
            margin-bottom: 6px;
            line-height: 1.55;
        }

        .cc-watch {
            background: rgba(214, 40, 40, .07);
            border: 1px solid rgba(214, 40, 40, .18);
            border-left: 3px solid rgba(214, 40, 40, .65);
            color: var(--ink-2);
            border-radius: 8px;
            padding: 10px 13px;
            font-size: 13.5px;
            line-height: 1.55;
            margin: 10px 0;
        }

        .cc-watch b {
            color: #c23030;
        }

        .cc-speed {
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: var(--accent);
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 7px;
            padding: 7px 12px;
            margin: 10px 0 0;
            display: inline-block;
        }

        .cc-problems {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .cc-problems .pl {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-right: 2px;
        }

        .chip-btn {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-2);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 5px 13px;
            cursor: pointer;
        }

        .chip-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fff;
        }

        details.cc-framework>summary {
            border-bottom: 1px dashed var(--border);
        }

        details.cc-framework .cc-body {
            background: linear-gradient(180deg, #fff, var(--bg));
        }

        .runtime-line {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 4px 14px;
            font-size: 13px;
        }

        .runtime-line b {
            font-family: var(--font-mono);
            color: var(--ink);
            font-weight: 600;
        }

        .runtime-line span {
            color: var(--ink-2);
        }

        .runtime-grid {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            background: var(--surface);
            margin: 8px 0;
        }

        .problem-row.flash {
            animation: flashBg 0.5s ease 3;
        }

        @keyframes flashBg {
            50% {
                background: rgba(255, 196, 0, .30);
            }
        }

        @media print {

            #sidenav,
            #sb-toggle,
            #sb-backdrop,
            .controls-row {
                display: none !important;
            }

            body {
                padding: 0 !important;
            }

            main.cheat-mode #app {
                display: none !important;
            }

            #cheat-view {
                display: block !important;
            }

            details.cheat-card .cc-body {
                display: block !important;
            }

            details.cheat-card>summary .cc-arrow {
                display: none;
            }

            details.cheat-card {
                break-inside: avoid;
            }

            .cheat-card,
            .cheat-hero {
                box-shadow: none;
            }
        }
    </style>

</head>

<body>
    <main class="container">
        <header>
            <p class="eyebrow">DSA Preparation</p>
            <h1>DSA Master Tracker</h1>
            <p class="tagline">Master the core patterns. Read the explanation, review the Python solution, and track
                your progress — one problem at a time.</p>
            <div class="stats-row">
                <div class="stat-card progress"><span class="stat-label">Progress</span><span class="stat-value"
                        id="progress-text">0 / 0</span>
                    <div class="progress-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>
                <div class="stat-card streak"><span class="stat-label">Current Streak</span><span class="stat-value"
                        id="streak-current">0</span></div>
                <div class="stat-card"><span class="stat-label">Best Streak</span><span class="stat-value"
                        id="streak-best">0</span></div>
            </div>
            <div class="controls-row"><input id="search-input" placeholder="Search a problem by name…"
                    aria-label="Search problems"><button class="btn-ghost" id="expand-all">Expand all</button><button
                    class="btn-ghost" id="collapse-all">Collapse all</button></div>
            <p id="no-results" class="hidden">No problems match your search.</p>
        </header>
        <div id="app"></div>
    </main>
    <footer>Created and maintained by Devesh Tiwari.</footer>
    <script>
        const topics = [
            ['Arrays & Hashing', ['Contains Duplicate', 'Valid Anagram', 'Two Sum', 'Group Anagrams', 'Top K Frequent Elements']],
            ['Two Pointers', ['Valid Palindrome', 'Two Sum II', '3Sum', 'Container With Most Water', 'Trapping Rain Water']],
            ['Sliding Window', ['Best Time to Buy and Sell Stock', 'Longest Substring Without Repeating Characters', 'Longest Repeating Character Replacement', 'Permutation in String', 'Minimum Window Substring']],
            ['Stack', ['Valid Parentheses', 'Min Stack', 'Evaluate Reverse Polish Notation', 'Generate Parentheses', 'Daily Temperatures']],
            ['Binary Search', ['Binary Search', 'Search a 2D Matrix', 'Koko Eating Bananas', 'Find Minimum in Rotated Sorted Array', 'Search in Rotated Sorted Array']],

            'Course Schedule': ['Build prerequisite edges and repeatedly remove zero-indegree courses. A cycle means not all courses can be removed.', 'from collections import defaultdict,deque\ndef canFinish(n, prerequisites):\n    g=defaultdict(list); indeg=[0]*n\n    for a,b in prerequisites:g[b].append(a); indeg[a]+=1\n    q=deque(i for i,x in enumerate(indeg) if x==0); done=0\n    while q:\n        u=q.popleft(); done+=1\n        for v in g[u]:\n            indeg[v]-=1\n            if indeg[v]==0:q.append(v)\n    return done==n', 'O(V+E) time · O(V+E) space'],

        const realSolutions = {
            'Trapping Rain Water': ['Scan with two pointers from both ends. The water stored over any column is bounded by the smaller of the tallest wall seen from the left and the right, so advance the pointer that currently has the smaller bound: its side cannot hold more than that, and moving inward keeps the maximum possible bound correct.', 'def trap(height):\n    l, r = 0, len(height) - 1\n    max_l = max_r = water = 0\n    while l < r:\n        if height[l] <= height[r]:\n            max_l = max(max_l, height[l])\n            water += max_l - height[l]\n            l += 1\n        else:\n            max_r = max(max_r, height[r])\n            water += max_r - height[r]\n            r -= 1\n    return water', 'O(n) time · O(1) space'],
            'Generate Parentheses': ['Backtracking: keep counts of open and close brackets already placed. You may add an open bracket while open < n, and a close bracket only when close < open, which guarantees every prefix stays valid and every generated string is a complete balanced pair.', 'def generateParenthesis(n):\n    res = []\n    def backtrack(open_n, close_n, path):\n        if len(path) == 2 * n:\n            res.append(path)\n            return\n        if open_n < n:\n            backtrack(open_n + 1, close_n, path + \'(\')\n        if close_n < open_n:\n            backtrack(open_n, close_n + 1, path + \')\')\n    backtrack(0, 0, \'\')\n    return res', 'O(4^n / sqrt(n)) time · O(n) space'],
            'Search a 2D Matrix': ['Each row is sorted and the last element of a row is smaller than the first of the next, so the matrix is one sorted array of length m*n. Flatten it virtually with index arithmetic and run plain binary search.', 'def searchMatrix(matrix, target):\n    m, n = len(matrix), len(matrix[0])\n    lo, hi = 0, m * n - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        val = matrix[mid // n][mid % n]\n        if val == target:\n            return True\n        if val < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return False', 'O(log(m*n)) time · O(1) space'],
            'Koko Eating Bananas': ['Binary search the eating speed. Feasibility is monotonic: if speed k finishes in h hours, every larger speed also fits. For a fixed speed each pile p takes ceil(p / k) hours, so search k in [1, max(piles)] for the smallest feasible value.', 'def minEatingSpeed(piles, h):\n    lo, hi = 1, max(piles)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        hours = sum((p + mid - 1) // mid for p in piles)\n        if hours <= h:\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo', 'O(n log max(piles)) time · O(1) space'],
            'Search in Rotated Sorted Array': ['Binary search with a twist: at every step one half (pivot side vs sorted side) is fully sorted. Compare nums[lo] with nums[mid] to detect which side is sorted, then test whether target lies inside that sorted half to decide which half to discard.', 'def search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:            # left half sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                 # right half sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1', 'O(log n) time · O(1) space'],
            'Merge Two Sorted Lists': ['Walk both lists with two pointers, always attaching the smaller head to the merged tail, and advance only that list. A dummy node removes the empty-list special case; when one list is exhausted, the rest of the other list is appended as is.', 'def mergeTwoLists(l1, l2):\n    dummy = tail = ListNode()\n    while l1 and l2:\n        if l1.val <= l2.val:\n            tail.next = l1\n            l1 = l1.next\n        else:\n            tail.next = l2\n            l2 = l2.next\n        tail = tail.next\n    tail.next = l1 or l2\n    return dummy.next', 'O(n + m) time · O(1) space'],
            'Reorder List': ['Three steps: (1) find the middle node with the fast/slow pointer trick, (2) reverse the second half, (3) weave the two halves together by alternating links. Detaching the halves first avoids accidental self-loops.', 'def reorderList(head):\n    if not head or not head.next:\n        return\n    slow = fast = head\n    while fast.next and fast.next.next:\n        slow = slow.next\n        fast = fast.next.next\n    second = slow.next          # start of second half\n    slow.next = None            # detach\n    prev = None                 # reverse second half\n    while second:\n        nxt = second.next\n        second.next = prev\n        prev = second\n        second = nxt\n    first, second = head, prev  # weave\n    while second:\n        t1, t2 = first.next, second.next\n        first.next = second\n        second.next = t1\n        first, second = t1, t2', 'O(n) time · O(1) space'],
            'Remove Nth Node From End of List': ['Advance a fast pointer n + 1 steps ahead of a slow pointer starting at the dummy. When fast hits the end, slow sits exactly before the node to delete, so skipping slow.next removes the target in one step with no length pre-scan.', 'def removeNthFromEnd(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n + 1):\n        fast = fast.next\n    while fast:\n        fast = fast.next\n        slow = slow.next\n    slow.next = slow.next.next\n    return dummy.next', 'O(n) time · O(1) space'],
            'Linked List Cycle': ['Floyd tortoise and hare: move slow one step and fast two steps per round. If a cycle exists the two pointers must eventually meet inside it; if fast reaches the end first there is no cycle.', 'def hasCycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False', 'O(n) time · O(1) space'],
            'Diameter of Binary Tree': ['Post-order DFS: for each node the longest path that passes through it equals left height + right height. Compute heights bottom-up and keep the global maximum of those sums; the height of a node is 1 + max of children heights.', 'def diameterOfBinaryTree(root):\n    best = 0\n    def depth(node):\n        nonlocal best\n        if not node:\n            return 0\n        l = depth(node.left)\n        r = depth(node.right)\n        best = max(best, l + r)\n        return 1 + max(l, r)\n    depth(root)\n    return best', 'O(n) time · O(h) space'],
            'Balanced Binary Tree': ['A single post-order pass decides everything: compute each subtree height and immediately return -1 as a failure sentinel if left and right heights differ by more than 1, or if a child already failed. Any -1 propagated to the root means the tree is unbalanced.', 'def isBalanced(root):\n    def height(node):\n        if not node:\n            return 0\n        l = height(node.left)\n        r = height(node.right)\n        if l < 0 or r < 0 or abs(l - r) > 1:\n            return -1\n        return 1 + max(l, r)\n    return height(root) >= 0', 'O(n) time · O(h) space'],
            'Same Tree': ['Recursive comparison: two nodes are identical when both are None, or both exist with equal values and identical left and right subtrees. Any mismatch at any node falsifies the whole tree, so short-circuit on the first difference.', 'def isSameTree(p, q):\n    if not p and not q:\n        return True\n    if not p or not q or p.val != q.val:\n        return False\n    return isSameTree(p.left, q.left) and isSameTree(p.right, q.right)', 'O(n) time · O(h) space'],
            'Clone Graph': ['BFS over the original graph while keeping a dictionary from original node to its clone. When visiting a node, create clones for unseen neighbors on the fly and wire them up; because every node is cloned exactly once, structure and shared references are preserved.', 'def cloneGraph(node):\n    if not node:\n        return None\n    clone_of = {node: Node(node.val)}\n    stack = [node]\n    while stack:\n        cur = stack.pop()\n        for nb in cur.neighbors:\n            if nb not in clone_of:\n                clone_of[nb] = Node(nb.val)\n                stack.append(nb)\n            clone_of[cur].neighbors.append(clone_of[nb])\n    return clone_of[node]', 'O(V + E) time · O(V) space'],
            'Max Area of Island': ['Scan every cell; when a 1 is found, flood-fill it with an explicit stack (counting cells and zeroing visited land) to measure one island, and update the best area. Zeroing cells on visit guarantees each cell is counted in exactly one island.', 'def maxAreaOfIsland(grid):\n    m, n = len(grid), len(grid[0])\n    best = 0\n    for i in range(m):\n        for j in range(n):\n            if grid[i][j] == 1:\n                area = 0\n                stack = [(i, j)]\n                grid[i][j] = 0\n                while stack:\n                    x, y = stack.pop()\n                    area += 1\n                    for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                        nx, ny = x + dx, y + dy\n                        if 0 <= nx < m and 0 <= ny < n and grid[nx][ny] == 1:\n                            grid[nx][ny] = 0\n                            stack.append((nx, ny))\n                best = max(best, area)\n    return best', 'O(m*n) time · O(m*n) space'],
            'Pacific Atlantic Water Flow': ['Think backwards: instead of flowing from every cell to the oceans, start from each ocean border and walk uphill (water flows down, so reverse edges go from low to high). Cells reachable from both the Pacific and Atlantic borders are the answer.', 'def pacificAtlantic(heights):\n    m, n = len(heights), len(heights[0])\n    def reachable(starts):\n        seen = set(starts)\n        stack = list(starts)\n        while stack:\n            x, y = stack.pop()\n            for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                nx, ny = x + dx, y + dy\n                if (0 <= nx < m and 0 <= ny < n and (nx, ny) not in seen\n                        and heights[nx][ny] >= heights[x][y]):\n                    seen.add((nx, ny))\n                    stack.append((nx, ny))\n        return seen\n    pac = reachable([(0, c) for c in range(n)] + [(r, 0) for r in range(m)])\n    atl = reachable([(m - 1, c) for c in range(n)] + [(r, n - 1) for r in range(m)])\n    return [[r, c] for r in range(m) for c in range(n)\n            if (r, c) in pac and (r, c) in atl]', 'O(m*n) time · O(m*n) space'],
            'Path with Maximum Probability': ['Dijkstra with the goal flipped: instead of minimizing distance, maximize probability. Push (negative probability, node) onto a max-heap and relax only when a neighbour can be reached with better probability than recorded; when the end node is popped, its probability is maximal.', 'import heapq\n\ndef maxProbability(n, edges, succProb, start, end):\n    adj = {}\n    for (u, v), p in zip(edges, succProb):\n        adj.setdefault(u, []).append((v, p))\n        adj.setdefault(v, []).append((u, p))\n    best = [0.0] * n\n    best[start] = 1.0\n    heap = [(-1.0, start)]\n    while heap:\n        neg_p, u = heapq.heappop(heap)\n        p = -neg_p\n        if p < best[u]:\n            continue\n        if u == end:\n            return p\n        for v, w in adj.get(u, []):\n            np_ = p * w\n            if np_ > best[v]:\n                best[v] = np_\n                heapq.heappush(heap, (-np_, v))\n    return 0.0', 'O(E log V) time · O(V + E) space'],
            'Find the City With the Smallest Number of Neighbors': ['The graph is dense and every city is a source, so run Floyd-Warshall: all-pairs shortest distances in O(n^3). Then for each city count neighbours within the threshold and pick the city with the smallest count, breaking ties toward the larger index.', 'def findTheCity(n, edges, distanceThreshold):\n    dist = [[float(\'inf\')] * n for _ in range(n)]\n    for i in range(n):\n        dist[i][i] = 0\n    for u, v, w in edges:\n        dist[u][v] = w\n        dist[v][u] = w\n    for k in range(n):\n        for i in range(n):\n            for j in range(n):\n                if dist[i][j] > dist[i][k] + dist[k][j]:\n                    dist[i][j] = dist[i][k] + dist[k][j]\n    best_city, best_count = -1, n\n    for i in range(n):\n        cnt = sum(1 for j in range(n) if dist[i][j] <= distanceThreshold)\n        if cnt <= best_count:\n            best_city, best_count = i, cnt\n    return best_city', 'O(n^3) time · O(n^2) space'],
            'Minimum Obstacle Removal to Reach Corner': ['Moving onto a cell costs either 0 (empty) or 1 (obstacle to remove), so run 0-1 BFS: a deque where zero-cost moves push to the front and one-cost moves to the back. Distances to cells are settled in increasing order, so the first arrival at the corner is minimal.', 'from collections import deque\n\ndef minimumObstacles(grid):\n    m, n = len(grid), len(grid[0])\n    dist = [[float(\'inf\')] * n for _ in range(m)]\n    dist[0][0] = 0\n    dq = deque([(0, 0)])\n    while dq:\n        x, y = dq.popleft()\n        if (x, y) == (m - 1, n - 1):\n            return dist[x][y]\n        for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nx, ny = x + dx, y + dy\n            if 0 <= nx < m and 0 <= ny < n:\n                cost = dist[x][y] + grid[nx][ny]\n                if cost < dist[nx][ny]:\n                    dist[nx][ny] = cost\n                    if grid[nx][ny]:\n                        dq.append((nx, ny))\n                    else:\n                        dq.appendleft((nx, ny))\n    return dist[m - 1][n - 1]', 'O(m*n) time · O(m*n) space'],
            'Path With Minimum Effort': ['Model effort as the maximum elevation difference along a path and minimize it with Dijkstra: effort(x,y) records the smallest possible bottleneck to reach that cell, relaxing neighbours with max(current effort, edge difference). Popping the target yields the minimum possible maximum step.', 'import heapq\n\ndef minimumEffortPath(heights):\n    m, n = len(heights), len(heights[0])\n    effort = [[float(\'inf\')] * n for _ in range(m)]\n    effort[0][0] = 0\n    heap = [(0, 0, 0)]\n    while heap:\n        e, x, y = heapq.heappop(heap)\n        if (x, y) == (m - 1, n - 1):\n            return e\n        if e > effort[x][y]:\n            continue\n        for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nx, ny = x + dx, y + dy\n            if 0 <= nx < m and 0 <= ny < n:\n                ne = max(e, abs(heights[nx][ny] - heights[x][y]))\n                if ne < effort[nx][ny]:\n                    effort[nx][ny] = ne\n                    heapq.heappush(heap, (ne, nx, ny))\n    return -1', 'O(m*n log(m*n)) time · O(m*n) space'],
            'Second Minimum Time to Reach Destination': ['Edges take fixed travel time but departures wait for green signals, so the time to cross an edge depends on when you arrive. Track the two smallest arrival times per node (dist1, dist2) in a Dijkstra-style search; the second-smallest arrival at the destination is the required second minimum.', 'import heapq\n\ndef secondMinimum(n, edges, time, change):\n    adj = [[] for _ in range(n + 1)]\n    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n    INF = float(\'inf\')\n    d1 = [INF] * (n + 1)\n    d2 = [INF] * (n + 1)\n    d1[1] = 0\n    heap = [(0, 1)]\n    while heap:\n        t, u = heapq.heappop(heap)\n        if t > d2[u]:\n            continue\n        if (t // change) % 2 == 1:          # wait for the next green window\n            t = t + change - (t % change)\n        nt = t + time\n        for v in adj[u]:\n            if nt < d1[v]:\n                d2[v] = d1[v]\n                d1[v] = nt\n                heapq.heappush(heap, (nt, v))\n            elif d1[v] < nt < d2[v]:\n                d2[v] = nt\n                heapq.heappush(heap, (nt, v))\n    return d2[n]', 'O((V + E) log V) time · O(V + E) space'],
            'Count of Smaller Numbers After Self': ['Process the array right to left while maintaining a Fenwick tree over value ranks: for nums[k], the count of later smaller numbers is the number of already-inserted ranks below it, answered with a prefix query before inserting its own rank. Coordinate compression keeps the tree small.', 'def countSmaller(nums):\n    ranks = {v: i + 1 for i, v in enumerate(sorted(set(nums)))}\n    size = len(ranks)\n    bit = [0] * (size + 1)\n\n    def add(i):\n        while i <= size:\n            bit[i] += 1\n            i += i & -i\n\n    def query(i):\n        s = 0\n        while i > 0:\n            s += bit[i]\n            i -= i & -i\n        return s\n\n    res = [0] * len(nums)\n    for k in range(len(nums) - 1, -1, -1):\n        r = ranks[nums[k]]\n        res[k] = query(r - 1)\n        add(r)\n    return res', 'O(n log n) time · O(n) space'],
            'Reverse Pairs': ['Count the pairs during merge sort: when merging two sorted halves, for each element of the left half count how many elements of the right half are less than half its value using an advancing pointer (both halves sorted, so the pointer only moves right). The merge keeps the halves sorted for the recursion above.', 'def reversePairs(nums):\n    def count_and_sort(lo, hi):\n        if hi - lo <= 1:\n            return 0\n        mid = (lo + hi) // 2\n        cnt = count_and_sort(lo, mid) + count_and_sort(mid, hi)\n        j = mid\n        for i in range(lo, mid):            # count reversed pairs\n            while j < hi and nums[i] > 2 * nums[j]:\n                j += 1\n            cnt += j - mid\n        left, right = nums[lo:mid], nums[mid:hi]\n        i = j = k = 0\n        while i < len(left) and j < len(right):\n            if left[i] <= right[j]:\n                nums[lo + k] = left[i]\n                i += 1\n            else:\n                nums[lo + k] = right[j]\n                j += 1\n            k += 1\n        while i < len(left):\n            nums[lo + k] = left[i]\n            i += 1\n            k += 1\n        while j < len(right):\n            nums[lo + k] = right[j]\n            j += 1\n            k += 1\n        return cnt\n\n    return count_and_sort(0, len(nums))', 'O(n log n) time · O(n) space'],
            'Falling Squares': ['Simulate drop by drop: each new square rises to the maximum height of every previously dropped square whose horizontal span it overlaps, plus its own side length. Since later squares only depend on earlier ones and at most 1000 squares exist, a plain O(n^2) scan over kept spans is sufficient.', 'def fallingSquares(positions):\n    placed = []          # (left, right, height)\n    res = []\n    tallest = 0\n    for left, side in positions:\n        right = left + side\n        base = 0\n        for l, r, h in placed:\n            if r > left and l < right:\n                base = max(base, h)\n        h = base + side\n        placed.append((left, right, h))\n        tallest = max(tallest, h)\n        res.append(tallest)\n    return res', 'O(n^2) time · O(n) space'],
            'Range Module': ['Maintain a sorted list of disjoint half-open intervals. addRange merges every overlapping interval into one; removeRange clips overlaps away, re-adding the leftover pieces before and after the removed stretch; queryRange walks intervals from the left edge and returns False the moment coverage has a hole.', 'class RangeModule:\n    def __init__(self):\n        self.iv = []          # sorted, disjoint [left, right)\n\n    def addRange(self, left, right):\n        merged = [left, right]\n        keep = []\n        for l, r in self.iv:\n            if r < left or l > right:\n                keep.append([l, r])\n            else:\n                merged[0] = min(merged[0], l)\n                merged[1] = max(merged[1], r)\n        keep.append(merged)\n        keep.sort()\n        self.iv = keep\n\n    def queryRange(self, left, right):\n        cur = left\n        for l, r in self.iv:\n            if l > cur:\n                return False\n            cur = max(cur, r)\n            if cur >= right:\n                return True\n        return cur >= right\n\n    def removeRange(self, left, right):\n        out = []\n        for l, r in self.iv:\n            if r <= left or l >= right:\n                out.append([l, r])\n            else:\n                if l < left:\n                    out.append([l, left])\n                if right < r:\n                    out.append([right, r])\n        self.iv = out', 'O(n) per operation · O(n) space'],
            'The Skyline Problem': ['Sweep all building edges from left to right with a max-heap of active heights (lazy deletion removes expired tops). At every event x, push starting buildings, pop finished ones, and whenever the current maximum height changes, emit a keypoint [x, new height]. Processing equal-x events before recording keeps the outline exact.', 'import heapq\n\ndef getSkyline(buildings):\n    events = []\n    for l, r, h in buildings:\n        events.append((l, -h, r))     # start\n        events.append((r, h, r))      # end marker\n    events.sort()\n    heap = [(0, float(\'inf\'))]\n    res = []\n    for x, h, r in events:\n        if h < 0:\n            heapq.heappush(heap, (h, r))\n        while heap and heap[0][1] <= x:      # lazy removal of ended tops\n            heapq.heappop(heap)\n        cur = -heap[0][0]\n        if not res or res[-1][1] != cur:\n            res.append([x, cur])\n    return res', 'O(n log n) time · O(n) space'],
            'Find the Index of the First Occurrence': ['KMP avoids re-scanning the haystack after a mismatch: the prefix table stores, for every prefix of the needle, the length of its longest proper border, so a failed comparison slides the needle by the safe amount. One linear scan then finds every match in O(n + m).', 'def strStr(haystack, needle):\n    if not needle:\n        return 0\n    m = len(needle)\n    table = [0] * m\n    j = 0\n    for i in range(1, m):\n        while j > 0 and needle[i] != needle[j]:\n            j = table[j - 1]\n        if needle[i] == needle[j]:\n            j += 1\n        table[i] = j\n    j = 0\n    for i in range(len(haystack)):\n        while j > 0 and haystack[i] != needle[j]:\n            j = table[j - 1]\n        if haystack[i] == needle[j]:\n            j += 1\n        if j == m:\n            return i - m + 1\n    return -1', 'O(n + m) time · O(m) space'],
            'Shortest Palindrome': ['A palindrome is prepended, so the answer is (needed reversed prefix) + s, where the needed part is whatever of s is not covered by the longest palindromic prefix of s. That longest palindromic prefix is found with KMP: build the prefix table of s + # + reverse(s); the final table value is its length.', 'def shortestPalindrome(s):\n    combo = s + \'#\' + s[::-1]\n    table = [0] * len(combo)\n    j = 0\n    for i in range(1, len(combo)):\n        while j > 0 and combo[i] != combo[j]:\n            j = table[j - 1]\n        if combo[i] == combo[j]:\n            j += 1\n        table[i] = j\n    longest_pal_pref = table[-1]\n    return s[longest_pal_pref:][::-1] + s', 'O(n) time · O(n) space'],
            'Repeated String Match': ['Repeating a q times guarantees b fits somewhere only if a total repetition count around ceil(len(b)/len(a)) suffices, so test q and q+1 repetitions (the +1 covers alignment at the boundary). Python in-string search handles the actual match check.', 'def repeatedStringMatch(a, b):\n    q = (len(b) - 1) // len(a) + 1\n    for reps in (q, q + 1):\n        if b in a * reps:\n            return reps\n    return -1', 'O(len(a) * q + len(b)) time · O(len(a) * q) space'],
            'Longest Happy Prefix': ['A happy prefix is a proper border of the string, and KMP prefix-function values measure exactly the longest border length of every prefix. Compute the table for s; its last entry is the length of the longest proper prefix equal to the suffix, i.e. the answer.', 'def longestPrefix(s):\n    n = len(s)\n    table = [0] * n\n    j = 0\n    for i in range(1, n):\n        while j > 0 and s[i] != s[j]:\n            j = table[j - 1]\n        if s[i] == s[j]:\n            j += 1\n        table[i] = j\n    return s[:table[-1]]', 'O(n) time · O(n) space'],
            'Distinct Subsequences': ['dp[j] counts the ways to form t[:j] while scanning s. Each character of s may either be skipped (carry the old count) or, when it equals t[j-1], extend all ways that already formed t[:j-1]; processing right to left in the row prevents double counting within one character.', 'def numDistinct(s, t):\n    n = len(t)\n    prev = [0] * (n + 1)\n    prev[0] = 1\n    for ch in s:\n        cur = prev[:]\n        for j in range(1, n + 1):\n            if ch == t[j - 1]:\n                cur[j] += prev[j - 1]\n        prev = cur\n    return prev[n]', 'O(m*n) time · O(n) space'],
            'Nim Game': ['The losing positions repeat every 4 stones: with 4 stones you lose no matter what, because any take leaves 1-3 for the opponent to finish, and that pattern shifts by multiples of 4. Therefore the first player wins exactly when n is not divisible by 4.', 'def canWinNim(n):\n    return n % 4 != 0', 'O(1) time · O(1) space'],
            'Bulb Switcher': ['Bulb k is toggled once per divisor of k, so it ends on exactly when k has an odd number of divisors, which happens precisely for perfect squares (divisors come in pairs otherwise). The count of bulbs on is therefore the number of perfect squares up to n, floor(sqrt(n)).', 'def bulbSwitch(n):\n    return int(n ** 0.5)', 'O(1) time · O(1) space'],
            '132 Pattern': ['Scan from the right keeping a decreasing stack of candidates for the 2 and tracking third, the largest value ever popped (best candidate for the 3). If some nums[i] is smaller than third, then i can be the 1 and a 132 pattern exists; every popped value was a valid 2 underneath a bigger 3.', 'def find132pattern(nums):\n    stack = []\n    third = float(\'-inf\')\n    for x in reversed(nums):\n        if x < third:\n            return True\n        while stack and stack[-1] < x:\n            third = max(third, stack.pop())\n        stack.append(x)\n    return False', 'O(n) time · O(n) space'],
            'Find All Duplicates in an Array': ['Every value lies in [1, n], so value v can be encoded at index v-1 using the sign bit without extra memory. Visit each element, look at the position named by its absolute value, and if that entry is already negative the value was seen before: it is a duplicate; otherwise flip the sign.', 'def findDuplicates(nums):\n    res = []\n    for x in nums:\n        idx = abs(x) - 1\n        if nums[idx] < 0:\n            res.append(abs(x))\n        nums[idx] = -nums[idx]\n    return res', 'O(n) time · O(1) space'],
            'LFU Cache': ['Store value and frequency per key plus an ordered map frequency -> keys so eviction is exact: the least frequently used item is the oldest key of the smallest non-empty frequency bucket (ties broken by insertion order via OrderedDict). A get or put bumps the key to the next frequency bucket; eviction happens on overflow.', 'from collections import OrderedDict, defaultdict\n\nclass LFUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.value = {}\n        self.freq = {}\n        self.buckets = defaultdict(OrderedDict)\n        self.min_f = 0\n\n    def _bump(self, key):\n        f = self.freq[key]\n        del self.buckets[f][key]\n        if not self.buckets[f] and f == self.min_f:\n            self.min_f += 1\n        f += 1\n        self.freq[key] = f\n        self.buckets[f][key] = None\n\n    def get(self, key):\n        if key not in self.value:\n            return -1\n        self._bump(key)\n        return self.value[key]\n\n    def put(self, key, val):\n        if self.cap == 0:\n            return\n        if key in self.value:\n            self.value[key] = val\n            self._bump(key)\n            return\n        if len(self.value) == self.cap:\n            evict = next(iter(self.buckets[self.min_f]))\n            del self.buckets[self.min_f][evict]\n            del self.value[evict]\n            del self.freq[evict]\n        self.value[key] = val\n        self.freq[key] = 1\n        self.buckets[1][key] = None\n        self.min_f = 1', 'O(1) amortized time per operation · O(capacity) space'],
            'Min Cost Climbing Stairs': ['Classic one-dimensional DP: dp[i] = min cost to reach stair i, where dp[i] = cost[i] + min(dp[i-1], dp[i-2]). Since only the last two values are ever needed, keep two rolling variables instead of an array, and answer with min of the last two stairs.', 'def minCostClimbingStairs(cost):\n    a = b = 0                      # cost to reach the previous two stairs\n    for c in cost:\n        a, b = b, min(a, b) + c\n    return min(a, b)', 'O(n) time · O(1) space'],
            'House Robber II': ['The houses form a circle, so the first and last house can never both be robbed. Break the circle: run the linear house-robbing DP twice, once excluding the first house and once excluding the last, and take the better result.', 'def rob(nums):\n    def linear(arr):\n        prev = cur = 0\n        for x in arr:\n            prev, cur = cur, max(cur, prev + x)\n        return cur\n    if len(nums) == 1:\n        return nums[0]\n    return max(linear(nums[:-1]), linear(nums[1:]))', 'O(n) time · O(1) space'],
            'Longest Palindromic Substring': ['A palindrome mirrors around its center, and every palindrome has a center that is either one character or the gap between two equal characters (2n - 1 centers total). Expand out from each center while the ends match and track the longest window found.', 'def longestPalindrome(s):\n    res = \'\'\n    for i in range(len(s)):\n        for lo, hi in ((i, i), (i, i + 1)):     # odd and even centers\n            while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n                lo -= 1\n                hi += 1\n            if hi - lo - 1 > len(res):\n                res = s[lo + 1:hi]\n    return res', 'O(n^2) time · O(1) space'],
            'Kth Largest Element in a Stream': ['Keep only the k largest elements seen so far in a min-heap. The smallest of those, the heap top, is exactly the kth largest. Every add pushes then evicts the current minimum if the heap exceeds size k, so the invariant always holds in O(log k).', 'import heapq\n\nclass KthLargest:\n    def __init__(self, k, nums):\n        self.k = k\n        self.h = list(nums)\n        heapq.heapify(self.h)\n        while len(self.h) > k:\n            heapq.heappop(self.h)\n\n    def add(self, val):\n        heapq.heappush(self.h, val)\n        if len(self.h) > self.k:\n            heapq.heappop(self.h)\n        return self.h[0]', 'O(log k) time per add · O(k) space'],
            'K Closest Points to Origin': ['Distance from the origin is x^2 + y^2, and only relative order matters so the square root is unnecessary. heapq.nsmallest finds the k smallest by this key in one pass: push each point and pop the farthest when the heap exceeds size k.', 'import heapq\n\ndef kClosest(points, k):\n    return heapq.nsmallest(k, points,\n                           key=lambda p: p[0] * p[0] + p[1] * p[1])', 'O(n log k) time · O(k) space'],
            'Task Scheduler': ['The most frequent task f forces at least (f-1) cool-down windows of length n, plus one slot for each task that appears f times. The real answer is the max of that formula and the total number of tasks, because idle time only appears when the formula exceeds len(tasks).', 'from collections import Counter\n\ndef leastInterval(tasks, n):\n    cnt = Counter(tasks)\n    mx = max(cnt.values())\n    num_max = sum(1 for v in cnt.values() if v == mx)\n    return max(len(tasks), (mx - 1) * (n + 1) + num_max)', 'O(n) time · O(1) space'],
            'Subsets': ['Iterative doubling: every number either joins or skips each existing subset. Starting from the empty set, for each element x append x to a copy of every subset produced so far, which doubles the list and generates all 2^n subsets without recursion.', 'def subsets(nums):\n    res = [[]]\n    for x in nums:\n        res += [s + [x] for s in res]\n    return res', 'O(n * 2^n) time · O(2^n) space'],
            'Combination Sum': ['Backtracking with a start index so combinations never reorder or repeat themselves. At each level try every candidate from start onward (reusing the same candidate is allowed, so recurse with the same index), prune when the running sum exceeds target.', 'def combinationSum(candidates, target):\n    res = []\n    def backtrack(start, path, total):\n        if total == target:\n            res.append(path[:])\n            return\n        if total > target:\n            return\n        for i in range(start, len(candidates)):\n            path.append(candidates[i])\n            backtrack(i, path, total + candidates[i])\n            path.pop()\n    backtrack(0, [], 0)\n    return res', 'O(2^(target)) time · O(target) space'],
            'Permutations': ['Backtracking that keeps a partial arrangement and the leftover pool. Each call tries placing every remaining element next; recursion depth n guarantees every ordering is visited exactly once because the pool strictly shrinks.', 'def permute(nums):\n    res = []\n    def backtrack(path, rest):\n        if not rest:\n            res.append(path[:])\n            return\n        for i, x in enumerate(rest):\n            backtrack(path + [x], rest[:i] + rest[i + 1:])\n    backtrack([], nums)\n    return res', 'O(n * n!) time · O(n!) space'],
            'Subsets II': ['Sort the input so duplicates are adjacent, then backtrack with the rule: at each level only take the first copy of a duplicated value. Skipping later identical values prevents duplicate subsets while keeping every distinct combination.', 'def subsetsWithDup(nums):\n    nums.sort()\n    res = []\n    def backtrack(start, path):\n        res.append(path[:])\n        for i in range(start, len(nums)):\n            if i > start and nums[i] == nums[i - 1]:\n                continue\n            path.append(nums[i])\n            backtrack(i + 1, path)\n            path.pop()\n    backtrack(0, [])\n    return res', 'O(n * 2^n) time · O(2^n) space'],
            'Word Search': ['DFS from every cell that matches the first letter, moving four-directionally and consuming letters by temporarily marking the current cell visited. If the recursion ever reaches the end of the word a path exists; otherwise restore the cell and keep searching.', 'def exist(board, word):\n    m, n = len(board), len(board[0])\n    def dfs(i, j, k):\n        if k == len(word):\n            return True\n        if not (0 <= i < m and 0 <= j < n) or board[i][j] != word[k]:\n            return False\n        tmp, board[i][j] = board[i][j], \'#\'\n        found = any(dfs(i + dx, j + dy, k + 1)\n                    for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)))\n        board[i][j] = tmp\n        return found\n    for i in range(m):\n        for j in range(n):\n            if board[i][j] == word[0] and dfs(i, j, 0):\n                return True\n    return False', 'O(m*n*4^L) time · O(L) space'],
            'Implement Trie (Prefix Tree)': ['A trie node stores a children map plus a word-end flag. Insert walks or creates child nodes for each character; search walks to the end and checks the flag; startsWith only needs the walk to succeed. All three run in O(word length) by trading space for speed.', 'class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_word = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            node = node.children.setdefault(ch, TrieNode())\n        node.is_word = True\n\n    def _walk(self, prefix):\n        node = self.root\n        for ch in prefix:\n            if ch not in node.children:\n                return None\n            node = node.children[ch]\n        return node\n\n    def search(self, word):\n        node = self._walk(word)\n        return node is not None and node.is_word\n\n    def startsWith(self, prefix):\n        return self._walk(prefix) is not None', 'O(L) time per operation · O(total characters) space'],
            'Design Add and Search Words Data Structure': ['A trie that also supports the . wildcard. Searching with a dot must branch into every child and continue recursively, so implement search as DFS over trie nodes with an index into the word; the branch factor is at most 26 only on dots.', 'class WordDictionary:\n    def __init__(self):\n        self.root = {}\n\n    def addWord(self, word):\n        node = self.root\n        for ch in word:\n            node = node.setdefault(ch, {})\n        node[\'#\'] = True\n\n    def search(self, word):\n        def dfs(node, i):\n            if i == len(word):\n                return \'#\' in node\n            ch = word[i]\n            if ch == \'.\':\n                return any(dfs(node[c], i + 1)\n                           for c in node if c != \'#\')\n            return ch in node and dfs(node[ch], i + 1)\n        return dfs(self.root, 0)', 'O(L) time per add · O(26^L) worst per search · O(total characters) space'],
            'Word Search II': ['Put every word into a trie, then run one DFS from each board cell. As the DFS walks characters it also walks trie nodes, so a word is found exactly when the DFS reaches a trie node flagged as an end; marking visited cells prevents reusing letters within one path.', 'class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.word = None\n\ndef findWords(board, words):\n    root = TrieNode()\n    for w in words:\n        node = root\n        for ch in w:\n            node = node.children.setdefault(ch, TrieNode())\n        node.word = w\n\n    m, n = len(board), len(board[0])\n    found = set()\n\n    def dfs(i, j, node):\n        ch = board[i][j]\n        if ch not in node.children:\n            return\n        nxt = node.children[ch]\n        if nxt.word:\n            found.add(nxt.word)\n        board[i][j] = \'#\'\n        for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            x, y = i + dx, j + dy\n            if 0 <= x < m and 0 <= y < n and board[x][y] != \'#\':\n                dfs(x, y, nxt)\n        board[i][j] = ch\n\n    for i in range(m):\n        for j in range(n):\n            dfs(i, j, root)\n    return list(found)', 'O(m*n*4^L) time · O(total word characters) space'],
            'Replace Words': ['Build a set of dictionary roots. For each word, probe progressively longer prefixes and cut the word at the first prefix that is a root; probing all the way to the full word is unnecessary only if a shorter root exists, and the else branch keeps words without any root.', 'def replaceWords(dictionary, sentence):\n    roots = set(dictionary)\n    out = []\n    for word in sentence.split():\n        for i in range(1, len(word) + 1):\n            if word[:i] in roots:\n                out.append(word[:i])\n                break\n        else:\n            out.append(word)\n    return \' \'.join(out)', 'O(total characters) expected time · O(total characters) space'],
            'Maximum XOR of Two Numbers in an Array': ['Insert every number into a binary trie (31 bits, most significant first), then for each number walk the trie greedily preferring the opposite bit at every level. Choosing the opposite bit whenever possible maximizes the XOR value bit by bit, which is optimal because higher bits dominate.', 'class BitNode:\n    def __init__(self):\n        self.child = [None, None]\n\ndef findMaximumXOR(nums):\n    root = BitNode()\n    for x in nums:\n        node = root\n        for b in range(31, -1, -1):\n            bit = (x >> b) & 1\n            if not node.child[bit]:\n                node.child[bit] = BitNode()\n            node = node.child[bit]\n\n    best = 0\n    for x in nums:\n        node, cur = root, 0\n        for b in range(31, -1, -1):\n            bit = (x >> b) & 1\n            want = 1 - bit\n            if node.child[want]:            # opposite bit exists: use it\n                cur |= 1 << b\n                node = node.child[want]\n            else:\n                node = node.child[bit]\n        best = max(best, cur)\n    return best', 'O(32n) time · O(32n) space'],
            'Reconstruct Itinerary': ['Hierholzer algorithm for Eulerian trails: sort each airports outgoing flights so destinations are tried in lexical order, then DFS, consuming edges by popping and appending airports on the way back up. Reversing the collected route yields the itinerary; trying lexically smallest edges first makes the DFS produce the lexicographically smallest valid route.', 'def findItinerary(tickets):\n    adj = {}\n    for a, b in sorted(tickets, reverse=True):\n        adj.setdefault(a, []).append(b)\n    route = []\n\n    def visit(airport):\n        while adj.get(airport):\n            visit(adj[airport].pop())\n        route.append(airport)\n\n    visit(\'JFK\')\n    return route[::-1]', 'O(E log E) time · O(E) space'],
            'Min Cost to Connect All Points': ['Prim algorithm: grow the spanning tree from an arbitrary point, always extending with the cheapest edge from the tree to any unvisited point. A heap of (distance, point) with lazy skipping of already-visited points avoids scanning all edges each round.', 'import heapq\n\ndef minCostConnectPoints(points):\n    n = len(points)\n    visited = [False] * n\n    min_dist = [float(\'inf\')] * n\n    min_dist[0] = 0\n    heap = [(0, 0)]\n    total = 0\n    while heap:\n        d, u = heapq.heappop(heap)\n        if visited[u]:\n            continue\n        visited[u] = True\n        total += d\n        for v in range(n):\n            if not visited[v]:\n                nd = abs(points[u][0] - points[v][0]) + abs(points[u][1] - points[v][1])\n                if nd < min_dist[v]:\n                    min_dist[v] = nd\n                    heapq.heappush(heap, (nd, v))\n    return total', 'O(n^2 log n) time · O(n^2) space'],
            'Network Delay Time': ['Dijkstra from node k: a min-heap of (time, node) always expands the currently earliest reached node, and a distance map skips stale heap entries. The answer is the largest settled distance if every node was reached, otherwise -1 means the graph is disconnected.', 'import heapq\n\ndef networkDelayTime(times, n, k):\n    adj = {}\n    for u, v, w in times:\n        adj.setdefault(u, []).append((v, w))\n    dist = {k: 0}\n    heap = [(0, k)]\n    while heap:\n        d, u = heapq.heappop(heap)\n        if d > dist.get(u, float(\'inf\')):\n            continue\n        for v, w in adj.get(u, []):\n            nd = d + w\n            if nd < dist.get(v, float(\'inf\')):\n                dist[v] = nd\n                heapq.heappush(heap, (nd, v))\n    if len(dist) != n:\n        return -1\n    return max(dist.values())', 'O(E log V) time · O(V + E) space'],
            'Swim in Rising Water': ['Dijkstra where the cost of a path is the maximum elevation along it. Push neighbors with max(current best, neighbor elevation); when the target is popped the stored value is the minimal possible bottleneck, which is exactly the earliest time the swim becomes possible.', 'import heapq\n\ndef swimInWater(grid):\n    n = len(grid)\n    heap = [(grid[0][0], 0, 0)]\n    seen = {(0, 0)}\n    while heap:\n        t, x, y = heapq.heappop(heap)\n        if (x, y) == (n - 1, n - 1):\n            return t\n        for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nx, ny = x + dx, y + dy\n            if 0 <= nx < n and 0 <= ny < n and (nx, ny) not in seen:\n                seen.add((nx, ny))\n                heapq.heappush(heap, (max(t, grid[nx][ny]), nx, ny))', 'O(n^2 log n) time · O(n^2) space'],
            'Cheapest Flights Within K Stops': ['Bellman-Ford capped at k + 1 rounds. Round i computes the cheapest price reachable with at most i flights by relaxing every edge from the previous rounds values only; copying the array each round is what enforces the stop limit instead of letting one round chain many flights.', 'def findCheapestPrice(n, flights, src, dst, k):\n    price = [float(\'inf\')] * n\n    price[src] = 0\n    for _ in range(k + 1):\n        nxt = price[:]\n        for u, v, w in flights:\n            if price[u] + w < nxt[v]:\n                nxt[v] = price[u] + w\n        price = nxt\n    return -1 if price[dst] == float(\'inf\') else price[dst]', 'O(k * E) time · O(n) space'],
            'Unique Paths': ['dp[i][j] = dp[i-1][j] + dp[i][j-1] because the robot arrives from above or from the left. Rolling the table into one row and updating left-to-right computes each cell from its up and left neighbours without a full matrix.', 'def uniquePaths(m, n):\n    row = [1] * n\n    for _ in range(1, m):\n        for j in range(1, n):\n            row[j] += row[j - 1]\n    return row[-1]', 'O(m*n) time · O(n) space'],
            'Longest Common Subsequence': ['dp[i][j] = length of LCS of text1[:i] and text2[:j]. Matching characters extend the previous diagonal by 1; otherwise carry the best of ignoring either the i-th or the j-th character. Keep only two rows since dp[i] depends solely on dp[i-1].', 'def longestCommonSubsequence(text1, text2):\n    m, n = len(text1), len(text2)\n    prev = [0] * (n + 1)\n    for i in range(1, m + 1):\n        cur = [0] * (n + 1)\n        for j in range(1, n + 1):\n            if text1[i - 1] == text2[j - 1]:\n                cur[j] = prev[j - 1] + 1\n            else:\n                cur[j] = max(prev[j], cur[j - 1])\n        prev = cur\n    return prev[n]', 'O(m*n) time · O(min(m, n)) space'],
            'Best Time to Buy and Sell Stock with Cooldown': ['Three-state DP over days: rest (no stock, not cooling), hold (owning stock), sold (just sold, enters cooldown). After selling you must rest one day before buying, which the sold-to-rest transition encodes; each day all three states update from the previous day only.', 'def maxProfit(prices):\n    rest, hold, sold = 0, float(\'-inf\'), 0\n    for p in prices:\n        rest, hold, sold = (\n            sold,\n            max(hold, rest - p),\n            hold + p\n        )\n    return max(rest, sold)', 'O(n) time · O(1) space'],
            'Coin Change II': ['Unbounded-knapsack counting DP: dp[a] = number of ways to make amount a using coins processed so far. Iterating coins in the outer loop and amounts upward lets each coin be reused any number of times while combinations, not permutations, are counted.', 'def change(amount, coins):\n    dp = [0] * (amount + 1)\n    dp[0] = 1\n    for c in coins:\n        for a in range(c, amount + 1):\n            dp[a] += dp[a - c]\n    return dp[amount]', 'O(coins * amount) time · O(amount) space'],
            'Target Sum': ['Assigning + and - signs means choosing a subset to subtract. If the positive subset sums to P then (total - P) - P = target, so P = (total + target) / 2: reduce the problem to counting subsets summing to P with the classic 0/1 knapsack count, iterating amounts downward so each number is used once.', 'def findTargetSumWays(nums, target):\n    total = sum(nums)\n    if abs(target) > total or (total + target) % 2:\n        return 0\n    s = (total + target) // 2\n    dp = [0] * (s + 1)\n    dp[0] = 1\n    for x in nums:\n        for t in range(s, x - 1, -1):\n            dp[t] += dp[t - x]\n    return dp[s]', 'O(n * sum) time · O(sum) space'],
            'Jump Game II': ['BFS-style greedy: treat every jump as expanding a frontier. Within the current reachable window track how far one more jump can extend it; the moment the window passes the last index, the number of jumps taken is minimal, because each jump maximally extends the frontier.', 'def jump(nums):\n    jumps = 0\n    end = 0\n    farthest = 0\n    for i in range(len(nums) - 1):\n        farthest = max(farthest, i + nums[i])\n        if i == end:\n            jumps += 1\n            end = farthest\n    return jumps', 'O(n) time · O(1) space'],
            'Gas Station': ['If total gas is below total cost no tour exists. Otherwise a valid start exists, and the classic trick is: whenever the running tank goes negative between i and i+1, no station up to i can be the start, so reset the candidate start to i+1 with an empty tank.', 'def canCompleteCircuit(gas, cost):\n    if sum(gas) < sum(cost):\n        return -1\n    start = 0\n    tank = 0\n    for i in range(len(gas)):\n        tank += gas[i] - cost[i]\n        if tank < 0:\n            start = i + 1\n            tank = 0\n    return start', 'O(n) time · O(1) space'],
            'Hand of Straights': ['Count card frequencies, then process card values in ascending order. The smallest remaining card x must start a group, so check that x, x+1, ..., x+groupSize-1 all exist and consume one copy of each; any missing card makes the deal impossible.', 'from collections import Counter\n\ndef isNStraightHand(hand, groupSize):\n    if len(hand) % groupSize:\n        return False\n    cnt = Counter(hand)\n    for x in sorted(cnt):\n        if cnt[x] > 0:\n            need = cnt[x]\n            for y in range(x, x + groupSize):\n                if cnt[y] < need:\n                    return False\n                cnt[y] -= need\n    return True', 'O(n log n) time · O(n) space'],
            'Insert Interval': ['Intervals before the new one end before its start and pass through untouched; intervals overlapping it are merged into one with widened bounds; everything after starts after its end and passes through untouched. Three linear sweeps in one pass.', 'def insert(intervals, newInterval):\n    l, r = newInterval\n    res = []\n    i = 0\n    while i < len(intervals) and intervals[i][1] < l:\n        res.append(intervals[i])\n        i += 1\n    while i < len(intervals) and intervals[i][0] <= r:\n        l = min(l, intervals[i][0])\n        r = max(r, intervals[i][1])\n        i += 1\n    res.append([l, r])\n    res.extend(intervals[i:])\n    return res', 'O(n) time · O(n) space'],
            'Merge Intervals': ['Sort by start time so overlapping intervals become adjacent. Walk the list, and whenever the next interval starts before or at the current merged end, extend the merged end; otherwise push the completed interval and start a new one.', 'def merge(intervals):\n    intervals.sort()\n    res = [intervals[0]]\n    for l, r in intervals[1:]:\n        if l <= res[-1][1]:\n            res[-1][1] = max(res[-1][1], r)\n        else:\n            res.append([l, r])\n    return res', 'O(n log n) time · O(n) space'],
            'Non-overlapping Intervals': ['Greedy by earliest end time: sorting by end and always keeping the interval that finishes first leaves the most room for the rest, so any interval that clashes with the kept one must be removed. Counting those removals minimizes total removals.', 'def eraseOverlapIntervals(intervals):\n    intervals.sort(key=lambda x: x[1])\n    end = float(\'-inf\')\n    removed = 0\n    for l, r in intervals:\n        if l >= end:\n            end = r\n        else:\n            removed += 1\n    return removed', 'O(n log n) time · O(1) space'],
            'Meeting Rooms (LintCode)': ['Sort all meetings by start time; two meetings conflict exactly when the next one starts before the previous one ends. After sorting, one adjacent check per pair detects any overlap, so a single pass decides whether one room suffices.', 'def canAttendMeetings(intervals):\n    intervals.sort()\n    for i in range(1, len(intervals)):\n        if intervals[i][0] < intervals[i - 1][1]:\n            return False\n    return True', 'O(n log n) time · O(1) space'],
            'Meeting Rooms II (LintCode)': ['Sort meetings by start and track the end times of rooms currently in use in a min-heap. When a meeting starts, free any room whose previous meeting has already ended (heap top), then allocate a room by pushing this meetings end; the heap size is the number of rooms needed.', 'import heapq\n\ndef minMeetingRooms(intervals):\n    intervals.sort()\n    rooms = []\n    for l, r in intervals:\n        if rooms and rooms[0] <= l:\n            heapq.heappop(rooms)\n        heapq.heappush(rooms, r)\n    return len(rooms)', 'O(n log n) time · O(n) space'],
            'Rotate Image': ['Rotating 90 degrees clockwise equals transposing the matrix (flip over the main diagonal) followed by reversing every row. Both operations are done in place with pairwise swaps, needing no extra matrix.', 'def rotate(matrix):\n    n = len(matrix)\n    for i in range(n):\n        for j in range(i + 1, n):\n            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]\n    for row in matrix:\n        row.reverse()', 'O(n^2) time · O(1) space'],
