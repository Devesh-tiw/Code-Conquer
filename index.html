            'Spiral Matrix': ['Shrink four boundaries (top, bottom, left, right) while walking the perimeter: go right along top, down along right, left along bottom, up along left, tightening one boundary after each side. The guards keep the walk from duplicating cells on the final inner ring.', 'def spiralOrder(matrix):\n    res = []\n    top, bottom = 0, len(matrix) - 1\n    left, right = 0, len(matrix[0]) - 1\n    while top <= bottom and left <= right:\n        for j in range(left, right + 1):\n            res.append(matrix[top][j])\n        top += 1\n        for i in range(top, bottom + 1):\n            res.append(matrix[i][right])\n        right -= 1\n        if top <= bottom:\n            for j in range(right, left - 1, -1):\n                res.append(matrix[bottom][j])\n            bottom -= 1\n        if left <= right:\n            for i in range(bottom, top - 1, -1):\n                res.append(matrix[i][left])\n            left += 1\n    return res', 'O(m*n) time · O(1) extra space'],
            'Set Matrix Zeroes': ['Use the first row and first column as flag storage instead of extra memory: mark column j and row i by zeroing matrix[0][j] and matrix[i][0] when a zero is found in the interior. Two booleans first remember whether the first row and column themselves contained zeros, which the flags cannot represent.', 'def setZeroes(matrix):\n    m, n = len(matrix), len(matrix[0])\n    first_row = first_col = False\n    for j in range(n):\n        if matrix[0][j] == 0:\n            first_row = True\n    for i in range(m):\n        if matrix[i][0] == 0:\n            first_col = True\n    for i in range(1, m):\n        for j in range(1, n):\n            if matrix[i][j] == 0:\n                matrix[i][0] = 0\n                matrix[0][j] = 0\n    for i in range(1, m):\n        for j in range(1, n):\n            if matrix[i][0] == 0 or matrix[0][j] == 0:\n                matrix[i][j] = 0\n    if first_row:\n        for j in range(n):\n            matrix[0][j] = 0\n    if first_col:\n        for i in range(m):\n            matrix[i][0] = 0', 'O(m*n) time · O(1) space'],
            'Number of 1 Bits': ['Repeatedly clear the lowest set bit with x = x & (x - 1) and count how many times this succeeds. Each iteration removes exactly one 1 bit, so the loop runs once per set bit rather than once per bit.', 'def hammingWeight(n):\n    cnt = 0\n    while n:\n        n &= n - 1\n        cnt += 1\n    return cnt', 'O(number of 1 bits) time · O(1) space'],
            'Reverse Bits': ['Process the 32 bits one at a time: shift the result left, append the lowest bit of n, and shift n right. Repeating 32 times rebuilds the number in reversed bit order; Python integers are arbitrary precision so masking is unnecessary here.', 'def reverseBits(n):\n    out = 0\n    for _ in range(32):\n        out = (out << 1) | (n & 1)\n        n >>= 1\n    return out', 'O(1) time · O(1) space'],
            'Redundant Connection': ['Add edges one by one to a union-find structure. The moment an edge connects two nodes already in the same component, adding it would close a cycle, so that edge is the redundant one. Processing in order makes the returned edge the last edge of the single cycle, as required.', 'def findRedundantConnection(edges):\n    parent = list(range(len(edges) + 1))\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n\n    for u, v in edges:\n        ru, rv = find(u), find(v)\n        if ru == rv:\n            return [u, v]\n        parent[ru] = rv', 'O(n alpha(n)) time · O(n) space'],
            'Number of Connected Components (LintCode)': ['Union-find over all nodes: every successful union of two different components reduces the component count by one, starting from n isolated nodes. An edge inside one component changes nothing, so the remaining counter is exactly the number of connected components.', 'def countComponents(n, edges):\n    parent = list(range(n))\n    count = n\n\n    def find(x):\n        if parent[x] != x:\n            parent[x] = find(parent[x])\n        return parent[x]\n\n    for u, v in edges:\n        ru, rv = find(u), find(v)\n        if ru != rv:\n            parent[ru] = rv\n            count -= 1\n    return count', 'O(E alpha(n)) time · O(n) space'],
            'Graph Valid Tree (LintCode)': ['A graph is a tree iff it has n-1 edges, is connected, and has no cycle. Union-find checks the last two at once: rejecting any edge that joins already-connected nodes proves there is no cycle, and with n-1 accepted unions the graph must be connected.', 'def validTree(n, edges):\n    if len(edges) != n - 1:\n        return False\n    parent = list(range(n))\n    rank = [0] * n\n\n    def find(x):\n        if parent[x] != x:\n            parent[x] = find(parent[x])\n        return parent[x]\n\n    for u, v in edges:\n        ru, rv = find(u), find(v)\n        if ru == rv:\n            return False\n        if rank[ru] < rank[rv]:\n            parent[ru] = rv\n        else:\n            parent[rv] = ru\n            if rank[ru] == rank[rv]:\n                rank[ru] += 1\n    return True', 'O(E alpha(n)) time · O(n) space'],
            'Accounts Merge': ['Union every email of one account with its first email, so all emails belonging to a person share a root; each email also records its owner name. After all unions, group emails by root, sort each group, and prepend the stored name.', 'def accountsMerge(accounts):\n    parent = {}\n    owner = {}\n\n    def find(x):\n        if parent[x] != x:\n            parent[x] = find(parent[x])\n        return parent[x]\n\n    def union(a, b):\n        parent[find(a)] = find(b)\n\n    for acc in accounts:\n        name = acc[0]\n        for email in acc[1:]:\n            owner[email] = name\n            if email not in parent:\n                parent[email] = email\n            union(email, acc[1])\n\n    groups = {}\n    for email in owner:\n        groups.setdefault(find(email), []).append(email)\n\n    return [[owner[emails[0]]] + sorted(emails) for emails in groups.values()]', 'O(total emails * alpha + sort) time · O(total emails) space'],
            'Number of Provinces': ['Treat the matrix as an adjacency matrix and count connected components with BFS/DFS: start a search from each unvisited city, marking every city reachable through direct or indirect connections; each search seeds exactly one province.', 'def findCircleNum(isConnected):\n    n = len(isConnected)\n    seen = set()\n    provinces = 0\n    for i in range(n):\n        if i in seen:\n            continue\n        provinces += 1\n        stack = [i]\n        seen.add(i)\n        while stack:\n            u = stack.pop()\n            for v in range(n):\n                if isConnected[u][v] and v not in seen:\n                    seen.add(v)\n                    stack.append(v)\n    return provinces', 'O(n^2) time · O(n) space'],
            'Course Schedule II': ['Kahn topological sort: build the prerequisite graph and indegrees, then repeatedly take a course with zero remaining prerequisites. Processing all zero-indegree courses in queue order yields a valid order; if leftover courses remain, the graph has a cycle and no order exists.', 'def findOrder(numCourses, prerequisites):\n    indeg = [0] * numCourses\n    adj = [[] for _ in range(numCourses)]\n    for a, b in prerequisites:\n        adj[b].append(a)\n        indeg[a] += 1\n    q = [i for i in range(numCourses) if indeg[i] == 0]\n    order = []\n    for node in q:\n        order.append(node)\n        for nb in adj[node]:\n            indeg[nb] -= 1\n            if indeg[nb] == 0:\n                q.append(nb)\n    return order if len(order) == numCourses else []', 'O(V + E) time · O(V + E) space'],
            'Alien Dictionary (LintCode)': ['Compare adjacent words: the first differing character pair (a, b) proves a precedes b, giving one directed edge. DFS over that character graph with a visiting set detects cycles (invalid dictionary), and appending nodes after their successors completes the topological order; a word that is a prefix of a longer later word also makes the order impossible.', 'def alienOrder(words):\n    adj = {c: set() for w in words for c in w}\n    for a, b in zip(words, words[1:]):\n        for x, y in zip(a, b):\n            if x != y:\n                adj[x].add(y)\n                break\n        else:\n            if len(a) > len(b):\n                return \'\'\n    visiting = set()\n    done = set()\n    order = []\n\n    def dfs(c):\n        if c in done:\n            return True\n        if c in visiting:\n            return False\n        visiting.add(c)\n        for nb in adj[c]:\n            if not dfs(nb):\n                return False\n        visiting.remove(c)\n        done.add(c)\n        order.append(c)\n        return True\n\n    for c in adj:\n        if not dfs(c):\n            return \'\'\n    return \'\'.join(order[::-1])', 'O(total characters) time · O(total characters) space'],
            'Minimum Height Trees': ['In any tree the centers of minimum height are one or two nodes, and trimming all leaves repeatedly peels the tree until only the center(s) remain. Track nodes of degree 1 as leaves and remove them layer by layer; when at most two nodes are left they are the roots of every MHT.', 'def findMinHeightTrees(n, edges):\n    if n == 1:\n        return [0]\n    adj = [set() for _ in range(n)]\n    for a, b in edges:\n        adj[a].add(b)\n        adj[b].add(a)\n    leaves = [i for i in range(n) if len(adj[i]) == 1]\n    remaining = n\n    while remaining > 2:\n        remaining -= len(leaves)\n        nxt = []\n        for leaf in leaves:\n            for nb in adj[leaf]:\n                adj[nb].remove(leaf)\n                if len(adj[nb]) == 1:\n                    nxt.append(nb)\n        leaves = nxt\n    return leaves', 'O(V + E) time · O(V + E) space'],
            'Find Eventual Safe States': ['A node is safe when every node reachable from it is safe, i.e. it lies on no cycle. Run DFS with three states (unvisited, on the current path, finished): meeting a node that is on the current path means a cycle was found, and any node reaching it is unsafe; everything that finishes cleanly is safe.', 'def eventualSafeNodes(graph):\n    n = len(graph)\n    state = [0] * n          # 0 = unvisited, 1 = on stack, 2 = safe\n\n    def dfs(u):\n        if state[u] != 0:\n            return state[u] == 2\n        state[u] = 1\n        for v in graph[u]:\n            if not dfs(v):\n                return False\n        state[u] = 2\n        return True\n\n    return [u for u in range(n) if dfs(u)]', 'O(V + E) time · O(V) space'],
            'Sequence Reconstruction (LintCode)': ['The sequences give pairwise precedence constraints, so build that DAG and topologically sort it. org is the unique reconstruction iff every number appears in some sequence, the precedence graph has no cycles, and at every topological step exactly one candidate node exists, producing org itself.', 'def sequenceReconstruction(org, seqs):\n    n = len(org)\n    pos = {x: i for i, x in enumerate(org)}\n    adj = [set() for _ in range(n + 1)]\n    indeg = [0] * (n + 1)\n    seen = [False] * (n + 1)\n\n    for seq in seqs:\n        for x in seq:\n            if not 1 <= x <= n:\n                return False\n            seen[x] = True\n        for a, b in zip(seq, seq[1:]):\n            if pos[a] >= pos[b]:\n                return False\n            if b not in adj[a]:\n                adj[a].add(b)\n                indeg[b] += 1\n\n    if not all(seen[1:]):\n        return False\n    q = [x for x in range(1, n + 1) if indeg[x] == 0]\n    order = []\n    while q:\n        if len(q) > 1:\n            return False\n        u = q.pop()\n        order.append(u)\n        for v in adj[u]:\n            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n    return order == org', 'O(n + total sequence length) time · O(n) space'],
            'Range Sum Query - Immutable': ['Precompute prefix sums where prefix[i] is the total of nums[:i]. Then any range sum is prefix[right+1] - prefix[left], a subtraction of two array lookups: building cost is paid once, and every query is O(1).', 'class NumArray:\n    def __init__(self, nums):\n        self.prefix = [0]\n        for x in nums:\n            self.prefix.append(self.prefix[-1] + x)\n\n    def sumRange(self, left, right):\n        return self.prefix[right + 1] - self.prefix[left]', 'O(n) build · O(1) per query · O(n) space'],
            'Subarray Sum Equals K': ['A subarray sum equals prefix[j] - prefix[i], so every subarray ending at j with sum k corresponds to a previous prefix equal to prefix[j] - k. Count how many times each prefix value has appeared while scanning, which turns the question into O(n) lookups.', 'def subarraySum(nums, k):\n    count = 0\n    prefix = 0\n    seen = {0: 1}\n    for x in nums:\n        prefix += x\n        count += seen.get(prefix - k, 0)\n        seen[prefix] = seen.get(prefix, 0) + 1\n    return count', 'O(n) time · O(n) space'],
            'Contiguous Array': ['Replace 0 by -1 so a balanced subarray is any window whose running sum is zero, i.e. two equal prefix sums. Record the first index where each prefix sum occurs; whenever the same sum reappears at index i, the gap is a balanced subarray, and the largest gap wins.', 'def findMaxLength(nums):\n    first = {0: -1}\n    s = 0\n    best = 0\n    for i, x in enumerate(nums):\n        s += 1 if x else -1\n        if s in first:\n            best = max(best, i - first[s])\n        else:\n            first[s] = i\n    return best', 'O(n) time · O(n) space'],
            'Palindromic Substrings': ['Every palindrome has a center: 2n-1 centers exist when counting gaps between characters as well. Expanding each center outward while the ends match counts every palindromic substring exactly once, because each substring is found only from its own center.', 'def countSubstrings(s):\n    n = len(s)\n    total = 0\n    for c in range(2 * n - 1):\n        lo = c // 2\n        hi = lo + c % 2\n        while lo >= 0 and hi < n and s[lo] == s[hi]:\n            total += 1\n            lo -= 1\n            hi += 1\n    return total', 'O(n^2) time · O(1) space'],
            'Decode String': ['Stack-based expansion: push (previous string, repeat count) whenever an opening bracket appears, rebuild the number digit by digit before it, and on a closing bracket pop the frame and append the repeated block to the accumulated string. Nested brackets then unfold inner-first automatically.', 'def decodeString(s):\n    stack = []\n    cur = \'\'\n    num = 0\n    for ch in s:\n        if ch.isdigit():\n            num = num * 10 + int(ch)\n        elif ch == \'[\':\n            stack.append((cur, num))\n            cur, num = \'\', 0\n        elif ch == \']\':\n            prev, k = stack.pop()\n            cur = prev + cur * k\n        else:\n            cur += ch\n    return cur', 'O(max_k * n) time · O(n) space'],
            'Find All Anagrams in a String': ['Fixed-size sliding window with a character count of p as the reference. Slide one character at a time: remove the outgoing letter, add the incoming one, and wherever the window counter equals the target counter an anagram starts. Counters of 26 letters compare in O(1).', 'from collections import Counter\n\ndef findAnagrams(s, p):\n    if len(p) > len(s):\n        return []\n    need = Counter(p)\n    window = Counter(s[:len(p)])\n    res = [0] if window == need else []\n    for i in range(len(p), len(s)):\n        old = s[i - len(p)]\n        window[old] -= 1\n        if window[old] == 0:\n            del window[old]\n        window[s[i]] += 1\n        if window == need:\n            res.append(i - len(p) + 1)\n    return res', 'O(n) time · O(1) space'],
            'LRU Cache': ['OrderedDict preserves insertion order and supports move_to_end and popitem(last=False), which is exactly the eviction semantics of LRU: any get or put refreshes the key to the back, and when capacity overflows the front (least recently used) item is dropped. Both operations stay O(1).', 'from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.data = OrderedDict()\n\n    def get(self, key):\n        if key not in self.data:\n            return -1\n        self.data.move_to_end(key)\n        return self.data[key]\n\n    def put(self, key, value):\n        if key in self.data:\n            self.data.move_to_end(key)\n        self.data[key] = value\n        if len(self.data) > self.cap:\n            self.data.popitem(last=False)', 'O(1) time per operation · O(capacity) space'],
            'Design Twitter': ['Store tweets per user with a globally decreasing timestamp so newer tweets sort first, and a follow set per user. The feed merges the ten newest tweets of the user plus all followees with a heap that always pops the most recent candidate tweet, then refills from that users history.', 'from collections import defaultdict\nimport heapq\n\nclass Twitter:\n    def __init__(self):\n        self.clock = 0\n        self.tweets = defaultdict(list)      # user -> [(time, tweetId)]\n        self.follows = defaultdict(set)\n\n    def postTweet(self, userId, tweetId):\n        self.tweets[userId].append((self.clock, tweetId))\n        self.clock -= 1\n\n    def getNewsFeed(self, userId):\n        users = [userId] + list(self.follows[userId])\n        heap = []\n        for u in users:\n            t = self.tweets[u]\n            if t:\n                heap.append((t[-1][0], t[-1][1], u, len(t) - 1))\n        heapq.heapify(heap)\n        feed = []\n        while heap and len(feed) < 10:\n            _, tid, u, idx = heapq.heappop(heap)\n            feed.append(tid)\n            if idx > 0:\n                time, tweet_id = self.tweets[u][idx - 1]\n                heapq.heappush(heap, (time, tweet_id, u, idx - 1))\n        return feed\n\n    def follow(self, followerId, followeeId):\n        if followerId != followeeId:\n            self.follows[followerId].add(followeeId)\n\n    def unfollow(self, followerId, followeeId):\n        self.follows[followerId].discard(followeeId)', 'O(1) post/follow · O(f + 10 log f) feed, f = users followed · O(tweets + follows) space'],
            'Insert Delete GetRandom O(1)': ['A list gives O(1) random access but slow deletes; a hash map gives O(1) lookups. Combine them: store values in a list with their indices in the map. Deleting swaps the victim with the last element, updates the maps index, then pops, keeping every operation average O(1).', 'import random\n\nclass RandomizedSet:\n    def __init__(self):\n        self.vals = []\n        self.pos = {}\n\n    def insert(self, val):\n        if val in self.pos:\n            return False\n        self.pos[val] = len(self.vals)\n        self.vals.append(val)\n        return True\n\n    def remove(self, val):\n        if val not in self.pos:\n            return False\n        i = self.pos[val]\n        last = self.vals[-1]\n        self.vals[i] = last\n        self.pos[last] = i\n        self.vals.pop()\n        del self.pos[val]\n        return True\n\n    def getRandom(self):\n        return random.choice(self.vals)', 'O(1) average time per operation · O(n) space'],
            'Design Underground System': ['Two maps do all the work: checkins maps a passenger id to (start station, time); trips maps a (start, end) pair to the running sum of durations and trip count. Check-out pops the checkin and accumulates; the average is simply sum divided by count.', 'class UndergroundSystem:\n    def __init__(self):\n        self.checkins = {}\n        self.trips = {}\n\n    def checkIn(self, id, stationName, t):\n        self.checkins[id] = (stationName, t)\n\n    def checkOut(self, id, stationName, t):\n        start, t0 = self.checkins.pop(id)\n        key = (start, stationName)\n        total, cnt = self.trips.get(key, (0.0, 0))\n        self.trips[key] = (total + t - t0, cnt + 1)\n\n    def getAverageTime(self, startStation, endStation):\n        total, cnt = self.trips[(startStation, endStation)]\n        return total / cnt', 'O(1) time per operation · O(n) space'],
            'Time Based Key-Value Store': ['Store for each key a parallel pair of lists: timestamps (append-only, so always sorted) and values. set appends to both; get binary-searches the largest timestamp <= the query and returns the matching value, since append order guarantees alignment between the lists.', 'from bisect import bisect_right\n\nclass TimeMap:\n    def __init__(self):\n        self.store = {}            # key -> (timestamps, values)\n\n    def set(self, key, value, timestamp):\n        times, values = self.store.get(key, ([], []))\n        times.append(timestamp)\n        values.append(value)\n        self.store[key] = (times, values)\n\n    def get(self, key, timestamp):\n        if key not in self.store:\n            return \'\'\n        times, values = self.store[key]\n        i = bisect_right(times, timestamp)\n        return values[i - 1] if i else \'\'', 'O(1) set · O(log n) get · O(n) space'],
            'Valid Sudoku': ['Track three families of sets: one per row, one per column, and one per 3x3 box keyed by box index 3*(i//3) + j//3. A digit already present in any of its three families means the board is invalid; a single pass over the 81 cells suffices.', 'def isValidSudoku(board):\n    rows = [set() for _ in range(9)]\n    cols = [set() for _ in range(9)]\n    boxes = [set() for _ in range(9)]\n    for i in range(9):\n        for j in range(9):\n            v = board[i][j]\n            if v == \'.\':\n                continue\n            b = 3 * (i // 3) + j // 3\n            if v in rows[i] or v in cols[j] or v in boxes[b]:\n                return False\n            rows[i].add(v)\n            cols[j].add(v)\n            boxes[b].add(v)\n    return True', 'O(1) time · O(1) space'],
            'Game of Life': ['Encode the next state in the second bit of each cell so all computations use the current (low-bit) state, then shift every cell right at the end. Applying the four rules needs only each cells live-neighbour count, which the low bits provide without any copy of the board.', 'def gameOfLife(board):\n    m, n = len(board), len(board[0])\n    for i in range(m):\n        for j in range(n):\n            live = 0\n            for dx in (-1, 0, 1):\n                for dy in (-1, 0, 1):\n                    if dx == 0 and dy == 0:\n                        continue\n                    x, y = i + dx, j + dy\n                    if 0 <= x < m and 0 <= y < n:\n                        live += board[x][y] & 1\n            if board[i][j] == 1 and live in (2, 3):\n                board[i][j] |= 2          # survives\n            if board[i][j] == 0 and live == 3:\n                board[i][j] |= 2          # born\n    for i in range(m):\n        for j in range(n):\n            board[i][j] >>= 1', 'O(m*n) time · O(1) space'],
            'Maximal Square': ['dp(i, j) = side of the largest all-ones square with bottom-right corner at (i, j). It equals 1 + min of the three neighbours (up, left, diagonal), because a bigger square exists only if all three smaller ones do. Roll the table to one row plus one diagonal variable.', 'def maximalSquare(matrix):\n    m, n = len(matrix), len(matrix[0])\n    prev = [0] * (n + 1)\n    best = 0\n    for i in range(m):\n        cur = [0] * (n + 1)\n        for j in range(n):\n            if matrix[i][j] == \'1\':\n                cur[j + 1] = min(prev[j + 1], cur[j], prev[j]) + 1\n                best = max(best, cur[j + 1])\n        prev = cur\n    return best * best', 'O(m*n) time · O(n) space'],
            'Surrounded Regions': ['Any O touching the border cannot be captured, and neither can any O region connected to it. Flood-fill from every border O, marking those regions with a temporary label; afterwards flip every remaining O (fully enclosed) to X and restore the temporary label to O.', 'def solve(board):\n    m, n = len(board), len(board[0])\n    stack = []\n    for i in range(m):\n        for j in (0, n - 1):\n            if board[i][j] == \'O\':\n                stack.append((i, j))\n    for j in range(n):\n        for i in (0, m - 1):\n            if board[i][j] == \'O\':\n                stack.append((i, j))\n    while stack:\n        x, y = stack.pop()\n        if not (0 <= x < m and 0 <= y < n) or board[x][y] != \'O\':\n            continue\n        board[x][y] = \'E\'\n        for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            stack.append((x + dx, y + dy))\n    for i in range(m):\n        for j in range(n):\n            if board[i][j] == \'E\':\n                board[i][j] = \'O\'\n            elif board[i][j] == \'O\':\n                board[i][j] = \'X\'', 'O(m*n) time · O(m*n) space'],
            'Next Greater Element I': ['Process nums2 once with a monotonic decreasing stack: when the current element x is greater than the top of the stack, x is the next greater element for every popped value, so record it in a map. Values left in the stack have no greater element; answer nums1 with O(1) map lookups.', 'def nextGreaterElement(nums1, nums2):\n    nxt = {}\n    stack = []\n    for x in nums2:\n        while stack and stack[-1] < x:\n            nxt[stack.pop()] = x\n        stack.append(x)\n    return [nxt.get(x, -1) for x in nums1]', 'O(n + m) time · O(n) space'],
            'Next Greater Element II': ['A circular array is handled by traversing two full passes with indices modulo n (each element is pushed at most once). The monotonic stack holds indices of unresolved elements; when the traversal wraps and encounters its own value nothing pops, so results are final after two passes.', 'def nextGreaterElements(nums):\n    n = len(nums)\n    res = [-1] * n\n    stack = []\n    for i in range(2 * n):\n        idx = i % n\n        while stack and nums[stack[-1]] < nums[idx]:\n            res[stack.pop()] = nums[idx]\n        if i < n:\n            stack.append(idx)\n    return res', 'O(n) time · O(n) space'],
            'Largest Rectangle in Histogram': ['For each bar its maximal rectangle spans until the first strictly shorter bar on each side. A monotonic increasing stack computes these bounds in one pass: when a bar is shorter than the stack top, the top bar can finally close a rectangle whose width extends to the current index, and the stack top underneath gives the left bound.', 'def largestRectangleArea(heights):\n    heights.append(0)          # sentinel flushes the stack\n    stack = [-1]\n    best = 0\n    for i, h in enumerate(heights):\n        while heights[stack[-1]] > h:\n            height = heights[stack.pop()]\n            width = i - stack[-1] - 1\n            best = max(best, height * width)\n        stack.append(i)\n    return best', 'O(n) time · O(n) space'],
            'Maximal Rectangle': ['Reduce each row to a histogram: heights[j] counts consecutive 1s ending at row i in column j. The best rectangle in that row-histogram is found by the monotonic-stack routine for Largest Rectangle in Histogram, so running the routine after each row update solves the full matrix in O(m*n).', 'def maximalRectangle(matrix):\n    if not matrix:\n        return 0\n    heights = [0] * len(matrix[0])\n    best = 0\n    for row in matrix:\n        for j, v in enumerate(row):\n            heights[j] = heights[j] + 1 if v == \'1\' else 0\n        best = max(best, _histogram(heights))\n    return best\n\ndef _histogram(heights):\n    heights = heights + [0]\n    stack = [-1]\n    area = 0\n    for i, h in enumerate(heights):\n        while heights[stack[-1]] > h:\n            height = heights[stack.pop()]\n            area = max(area, height * (i - stack[-1] - 1))\n        stack.append(i)\n    return area', 'O(m*n) time · O(n) space'],
            'Remove K Digits': ['Leftmost digits carry the most weight, so a greedy monotonic stack is optimal: while the newest kept digit is larger than the incoming digit and removals remain, discard it. After the scan, if removals are left they are taken from the tail, and leading zeros are stripped.', 'def removeKdigits(num, k):\n    stack = []\n    for d in num:\n        while k and stack and stack[-1] > d:\n            stack.pop()\n            k -= 1\n        stack.append(d)\n    if k:\n        stack = stack[:-k]\n    return \'\'.join(stack).lstrip(\'0\') or \'0\'', 'O(n) time · O(n) space'],
            'Validate Binary Search Tree': ['A BST requires every node value to lie inside an open interval inherited from its ancestors. Recurse with low and high bounds, tightening the upper bound for the left child and the lower bound for the right child; any violation found anywhere falsifies the whole tree.', 'def isValidBST(root):\n    def check(node, lo, hi):\n        if not node:\n            return True\n        if not (lo < node.val < hi):\n            return False\n        return (check(node.left, lo, node.val)\n                and check(node.right, node.val, hi))\n    return check(root, float(\'-inf\'), float(\'inf\'))', 'O(n) time · O(h) space'],
            'Kth Smallest Element in a BST': ['In-order traversal of a BST visits values in ascending order, so the kth visited node is the answer. An explicit stack with a push-left pattern avoids recursion: pop the smallest pending node, count it, then descend into its right subtree to keep the in-order invariant.', 'def kthSmallest(root, k):\n    stack = []\n    while True:\n        while root:\n            stack.append(root)\n            root = root.left\n        root = stack.pop()\n        k -= 1\n        if k == 0:\n            return root.val\n        root = root.right', 'O(h + k) time · O(h) space'],
            'Construct Tree from Preorder and Inorder Traversal': ['Preorder gives the next root first; in the inorder array that root splits the left and right subtrees by position. Recurse with a preorder index and an inorder range, using a value-to-index map for O(1) splits; consuming preorder left-first automatically builds the tree shape.', 'def buildTree(preorder, inorder):\n    in_pos = {v: i for i, v in enumerate(inorder)}\n    pre_idx = 0\n\n    def build(lo, hi):\n        nonlocal pre_idx\n        if lo > hi:\n            return None\n        val = preorder[pre_idx]\n        pre_idx += 1\n        node = TreeNode(val)\n        mid = in_pos[val]\n        node.left = build(lo, mid - 1)\n        node.right = build(mid + 1, hi)\n        return node\n\n    return build(0, len(inorder) - 1)', 'O(n) time · O(n) space'],
            'Binary Search Tree Iterator': ['Keep a stack of left-spine nodes. hasNext checks the stack; next pops the smallest pending node, returns it, then pushes the left spine of its right child, preserving in-order sequence. Each node enters and leaves the stack once, so operations are amortized O(1).', 'class BSTIterator:\n    def __init__(self, root):\n        self.stack = []\n        self._push_left(root)\n\n    def _push_left(self, node):\n        while node:\n            self.stack.append(node)\n            node = node.left\n\n    def next(self):\n        node = self.stack.pop()\n        self._push_left(node.right)\n        return node.val\n\n    def hasNext(self):\n        return bool(self.stack)', 'O(1) amortized next · O(h) space'],
            'Delete Node in a BST': ['Recursively route toward the key. When found: zero children means remove the node; one child means splice that child up; two children means replace the value with its in-order successor (leftmost of the right subtree) and recursively delete that successor from the right subtree, preserving BST order.', 'def deleteNode(root, key):\n    if not root:\n        return None\n    if key < root.val:\n        root.left = deleteNode(root.left, key)\n    elif key > root.val:\n        root.right = deleteNode(root.right, key)\n    else:\n        if not root.left:\n            return root.right\n        if not root.right:\n            return root.left\n        succ = root.right\n        while succ.left:\n            succ = succ.left\n        root.val = succ.val\n        root.right = deleteNode(root.right, succ.val)\n    return root', 'O(h) time · O(h) space'],
            'Pow(x, n)': ['Binary exponentiation squares the base and halves the exponent each round; wherever the exponent has a set bit the running result multiplies in the current base. This computes x^n with O(log n) multiplications instead of n, and negating n first handles negative powers.', 'def myPow(x, n):\n    if n < 0:\n        x, n = 1.0 / x, -n\n    res = 1.0\n    while n:\n        if n & 1:\n            res *= x\n        x *= x\n        n >>= 1\n    return res', 'O(log n) time · O(1) space'],
            'Multiply Strings': ['Digit-by-digit grade-school multiplication: the product of digits at positions i and j lands in result positions i+j (carry) and i+j+1 (unit). Accumulate into an integer array from the right, then flatten to a string and drop leading zeros.', 'def multiply(num1, num2):\n    if num1 == \'0\' or num2 == \'0\':\n        return \'0\'\n    res = [0] * (len(num1) + len(num2))\n    for i in range(len(num1) - 1, -1, -1):\n        for j in range(len(num2) - 1, -1, -1):\n            p = (ord(num1[i]) - 48) * (ord(num2[j]) - 48)\n            total = res[i + j + 1] + p\n            res[i + j + 1] = total % 10\n            res[i + j] += total // 10\n    out = \'\'.join(map(str, res)).lstrip(\'0\')\n    return out', 'O(n*m) time · O(n + m) space'],
            'Integer to English Words': ['Chunk the number into groups of three digits (billions, millions, thousands). A recursive helper converts any number below 1000 using lookup tables for the teens and tens, then the groups are joined with their scale words; zero is handled as a special case.', 'def numberToWords(num):\n    if num == 0:\n        return \'Zero\'\n    ones = [\'\', \'One\', \'Two\', \'Three\', \'Four\', \'Five\', \'Six\', \'Seven\',\n            \'Eight\', \'Nine\', \'Ten\', \'Eleven\', \'Twelve\', \'Thirteen\',\n            \'Fourteen\', \'Fifteen\', \'Sixteen\', \'Seventeen\', \'Eighteen\',\n            \'Nineteen\']\n    tens = [\'\', \'\', \'Twenty\', \'Thirty\', \'Forty\', \'Fifty\', \'Sixty\',\n            \'Seventy\', \'Eighty\', \'Ninety\']\n\n    def below_hundred(n):\n        if n < 20:\n            return ones[n]\n        return (tens[n // 10] + \' \' + ones[n % 10]).strip()\n\n    def below_thousand(n):\n        if n >= 100:\n            return (ones[n // 100] + \' Hundred \' + below_hundred(n % 100)).strip()\n        return below_hundred(n)\n\n    parts = []\n    for unit, word in ((10**9, \'Billion\'), (10**6, \'Million\'), (10**3, \'Thousand\')):\n        if num >= unit:\n            parts.append(below_thousand(num // unit) + \' \' + word)\n            num %= unit\n    if num:\n        parts.append(below_thousand(num))\n    return \' \'.join(parts)', 'O(1) time · O(1) space'],
            'Excel Sheet Column Number': ['Excel columns are base-26 with digits 1..26 instead of 0..25, which the formula value = value * 26 + digit handles directly. Scanning left to right and folding each character (A = 1) reproduces the column number, e.g. AB = 26 + 2 = 28.', 'def titleToNumber(columnTitle):\n    res = 0\n    for ch in columnTitle:\n        res = res * 26 + (ord(ch) - 64)\n    return res', 'O(n) time · O(1) space'],
            'Roman to Integer': ['Roman numerals are additive except when a smaller digit precedes a larger one (IV = 4, IX = 9), where the smaller is subtracted. Scanning right to left and subtracting whenever the current digit is smaller than the previously seen one implements this rule without lookahead.', 'def romanToInt(s):\n    val = {\'I\': 1, \'V\': 5, \'X\': 10, \'L\': 50, \'C\': 100, \'D\': 500, \'M\': 1000}\n    total = 0\n    prev = 0\n    for ch in reversed(s):\n        v = val[ch]\n        if v < prev:\n            total -= v\n        else:\n            total += v\n        prev = v\n    return total', 'O(n) time · O(1) space'],
            'Word Ladder': ['BFS over the word graph, where neighbours of a word are all dictionary words one letter away. Generating neighbours by replacing each position with all 26 letters and testing membership in the word set avoids pre-building a huge adjacency list; removing a word on first visit keeps BFS levels minimal.', 'from collections import deque\n\ndef ladderLength(beginWord, endWord, wordList):\n    words = set(wordList)\n    if endWord not in words:\n        return 0\n    q = deque([beginWord])\n    steps = 1\n    while q:\n        for _ in range(len(q)):\n            w = q.popleft()\n            if w == endWord:\n                return steps\n            for i in range(len(w)):\n                for c in \'abcdefghijklmnopqrstuvwxyz\':\n                    nw = w[:i] + c + w[i + 1:]\n                    if nw in words:\n                        words.remove(nw)\n                        q.append(nw)\n        steps += 1\n    return 0', 'O(N * L * 26) time · O(N) space'],
            'Shortest Path in Binary Matrix': ['BFS on an 8-directional grid through cells holding 0. The first time the bottom-right corner is dequeued gives its shortest path because BFS visits cells in order of distance; marking cells on arrival prevents both revisits and infinite loops.', 'from collections import deque\n\ndef shortestPathBinaryMatrix(grid):\n    n = len(grid)\n    if grid[0][0] or grid[n - 1][n - 1]:\n        return -1\n    q = deque([(0, 0)])\n    grid[0][0] = 1\n    dist = 1\n    while q:\n        for _ in range(len(q)):\n            x, y = q.popleft()\n            if (x, y) == (n - 1, n - 1):\n                return dist\n            for dx in (-1, 0, 1):\n                for dy in (-1, 0, 1):\n                    nx, ny = x + dx, y + dy\n                    if 0 <= nx < n and 0 <= ny < n and grid[nx][ny] == 0:\n                        grid[nx][ny] = 1\n                        q.append((nx, ny))\n        dist += 1\n    return -1', 'O(n^2) time · O(n^2) space'],
            'Rotting Oranges': ['Multi-source BFS: seed the queue with every rotten orange and count fresh ones. Each BFS minute rots all fresh neighbours of the current frontier; the level count is the answer, while any fresh orange left after the search means it was unreachable (-1).', 'from collections import deque\n\ndef orangesRotting(grid):\n    m, n = len(grid), len(grid[0])\n    q = deque()\n    fresh = 0\n    for i in range(m):\n        for j in range(n):\n            if grid[i][j] == 2:\n                q.append((i, j))\n            elif grid[i][j] == 1:\n                fresh += 1\n    minutes = 0\n    while q and fresh:\n        for _ in range(len(q)):\n            x, y = q.popleft()\n            for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                nx, ny = x + dx, y + dy\n                if 0 <= nx < m and 0 <= ny < n and grid[nx][ny] == 1:\n                    grid[nx][ny] = 2\n                    fresh -= 1\n                    q.append((nx, ny))\n        minutes += 1\n    return -1 if fresh else minutes', 'O(m*n) time · O(m*n) space'],
            'Snakes and Ladders': ['Map the zigzag board into a 1-based linear array (snake rows run right, odd-numbered rows run left), then BFS over positions 1..n^2 rolling a 1..6 die. When a cell holds a ladder or snake, the destination overrides the landing square; first arrival at n^2 is the minimum moves.', 'from collections import deque\n\ndef snakesAndLadders(board):\n    n = len(board)\n    cells = [0]\n    for i in range(n):\n        row = board[n - 1 - i]\n        cells += row if i % 2 == 0 else row[::-1]\n    dist = [-1] * (n * n + 1)\n    dist[1] = 0\n    q = deque([1])\n    while q:\n        p = q.popleft()\n        if p == n * n:\n            return dist[p]\n        for d in range(1, 7):\n            np_ = p + d\n            if np_ > n * n:\n                break\n            if cells[np_] != -1:\n                np_ = cells[np_]\n            if dist[np_] == -1:\n                dist[np_] = dist[p] + 1\n                q.append(np_)\n    return -1', 'O(n^2) time · O(n^2) space'],
            'Open the Lock': ['BFS over the 10^4 wheel states, where each state has 8 neighbours (each of 4 wheels turned one step up or down). Deadends are pruned before enqueueing, and the first time the target state is dequeued is the minimum number of turns because BFS explores by distance.', 'from collections import deque\n\ndef openLock(deadends, target):\n    dead = set(deadends)\n    if \'0000\' in dead:\n        return -1\n    q = deque([\'0000\'])\n    seen = {\'0000\'}\n    turns = 0\n    while q:\n        for _ in range(len(q)):\n            state = q.popleft()\n            if state == target:\n                return turns\n            for i in range(4):\n                for delta in (1, -1):\n                    nxt = (state[:i] + str((int(state[i]) + delta) % 10)\n                            + state[i + 1:])\n                    if nxt not in seen and nxt not in dead:\n                        seen.add(nxt)\n                        q.append(nxt)\n        turns += 1\n    return -1', 'O(10^4 * 4 * 10) time · O(10^4) space'],
            'Word Break': ['dp[i] marks whether s[:i] can be segmented. A position i is reachable when some earlier reachable j has s[j:i] in the dictionary; checking all split points for each prefix gives an O(n^2) dynamic program that answers whether the full string segments.', 'def wordBreak(s, wordDict):\n    words = set(wordDict)\n    n = len(s)\n    dp = [False] * (n + 1)\n    dp[0] = True\n    for i in range(1, n + 1):\n        for j in range(i):\n            if dp[j] and s[j:i] in words:\n                dp[i] = True\n                break\n    return dp[n]', 'O(n^2) time · O(n) space'],
            'Longest Increasing Subsequence': ['Patience sorting: tails[k] keeps the smallest possible tail of an increasing subsequence of length k+1. For each number, binary search the first tail that is not smaller and replace it (or append); because tails stays sorted, the final length is the LIS length.', 'from bisect import bisect_left\n\ndef lengthOfLIS(nums):\n    tails = []\n    for x in nums:\n        i = bisect_left(tails, x)\n        if i == len(tails):\n            tails.append(x)\n        else:\n            tails[i] = x\n    return len(tails)', 'O(n log n) time · O(n) space'],
            'Edit Distance': ['dp[i][j] is the edit distance between word1[:i] and word2[:j]. Equal characters cost nothing (copy the diagonal); otherwise insert/delete/substitute cost 1 + the best of the three neighbouring states. Only the previous row is needed, giving O(n) memory.', 'def minDistance(word1, word2):\n    m, n = len(word1), len(word2)\n    prev = list(range(n + 1))\n    for i in range(1, m + 1):\n        cur = [i] + [0] * n\n        for j in range(1, n + 1):\n            if word1[i - 1] == word2[j - 1]:\n                cur[j] = prev[j - 1]\n            else:\n                cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])\n        prev = cur\n    return prev[n]', 'O(m*n) time · O(n) space'],
            'Regular Expression Matching': ['dp[i][j] states whether s[:i] matches p[:j]. A plain character or a dot must match one character and advance both; a star either skips the pair (zero repeats, dp[i][j-2]) or, if the preceding pattern element matches s[i-1], consumes one character and stays on the star (dp[i-1][j]). Filling the table bottom-up handles every pattern shape.', 'def isMatch(s, p):\n    m, n = len(s), len(p)\n    dp = [[False] * (n + 1) for _ in range(m + 1)]\n    dp[0][0] = True\n    for j in range(2, n + 1):\n        if p[j - 1] == \'*\':\n            dp[0][j] = dp[0][j - 2]\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if p[j - 1] == \'*\':\n                dp[i][j] = dp[i][j - 2] or (\n                    dp[i - 1][j] and (p[j - 2] == s[i - 1] or p[j - 2] == \'.\'))\n            else:\n                dp[i][j] = dp[i - 1][j - 1] and (\n                    p[j - 1] == s[i - 1] or p[j - 1] == \'.\')\n    return dp[m][n]', 'O(m*n) time · O(m*n) space'],
            'Wildcard Matching': ['dp[i][j] states whether s[:i] matches p[:j]. A question mark matches exactly one character; a star either matches nothing (dp[i][j-1]) or one more character (dp[i-1][j]); plain characters must be equal. Filling the table bottom-up explores all star assignments without backtracking.', 'def isMatch(s, p):\n    m, n = len(s), len(p)\n    dp = [[False] * (n + 1) for _ in range(m + 1)]\n    dp[0][0] = True\n    for j in range(1, n + 1):\n        if p[j - 1] == \'*\':\n            dp[0][j] = True\n        else:\n            break\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if p[j - 1] == \'*\':\n                dp[i][j] = dp[i][j - 1] or dp[i - 1][j]\n            elif p[j - 1] in (s[i - 1], \'?\'):\n                dp[i][j] = dp[i - 1][j - 1]\n    return dp[m][n]', 'O(m*n) time · O(m*n) space'],
            'Sliding Window Maximum': ['A monotonic deque of indices holds candidates in decreasing value order. Before each push, pop smaller values from the back because the newcomer dominates them while it is inside the window; pop the front once it slides out of the window. The front is always the windows maximum, giving amortized O(1) per step.', 'from collections import deque\n\ndef maxSlidingWindow(nums, k):\n    dq = deque()\n    out = []\n    for i, x in enumerate(nums):\n        while dq and nums[dq[-1]] <= x:\n            dq.pop()\n        dq.append(i)\n        if dq[0] <= i - k:\n            dq.popleft()\n        if i >= k - 1:\n            out.append(nums[dq[0]])\n    return out', 'O(n) time · O(k) space'],
            'Find Median from Data Stream': ['Split the stream into two heaps: a max-heap for the smaller half and a min-heap for the larger half, rebalanced so sizes differ by at most one. The median is the top of the larger heap (odd count) or the average of both tops (even count).', 'import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.small = []      # max-heap, stored negated\n        self.large = []      # min-heap\n\n    def addNum(self, num):\n        heapq.heappush(self.small, -num)\n        heapq.heappush(self.large, -heapq.heappop(self.small))\n        if len(self.large) > len(self.small):\n            heapq.heappush(self.small, -heapq.heappop(self.large))\n\n    def findMedian(self):\n        if len(self.small) > len(self.large):\n            return -self.small[0]\n        return (-self.small[0] + self.large[0]) / 2.0', 'O(log n) add · O(1) median · O(n) space'],
            'Merge k Sorted Lists': ['Push every lists head into a min-heap keyed by value (with the list index to break ties), then repeatedly pop the smallest node, append it, and push back its successor. Popping k*n nodes and pushing n times total costs O(k*n log k).', 'import heapq\n\ndef mergeKLists(lists):\n    heap = []\n    for i, node in enumerate(lists):\n        if node:\n            heapq.heappush(heap, (node.val, i, node))\n    dummy = tail = ListNode()\n    while heap:\n        val, i, node = heapq.heappop(heap)\n        tail.next = node\n        tail = node\n        if node.next:\n            heapq.heappush(heap, (node.next.val, i, node.next))\n    return dummy.next', 'O(N log k) time · O(k) space'],
            'Range Sum Query - Mutable': ['A Fenwick (binary indexed) tree stores partial sums so both point updates and prefix queries cost O(log n). update adds the difference at the index and walks i += i & -i; a range sum is prefix(right+1) - prefix(left).', 'class NumArray:\n    def __init__(self, nums):\n        self.nums = nums\n        self.n = len(nums)\n        self.bit = [0] * (self.n + 1)\n        for i, x in enumerate(nums):\n            self._add(i + 1, x)\n\n    def _add(self, i, delta):\n        while i <= self.n:\n            self.bit[i] += delta\n            i += i & -i\n\n    def _sum(self, i):\n        s = 0\n        while i > 0:\n            s += self.bit[i]\n            i -= i & -i\n        return s\n\n    def update(self, index, val):\n        delta = val - self.nums[index]\n        self.nums[index] = val\n        self._add(index + 1, delta)\n\n    def sumRange(self, left, right):\n        return self._sum(right + 1) - self._sum(left)', 'O(log n) per operation · O(n) space'],
            'Prefix and Suffix Search': ['Precompute a dictionary over every (prefix, suffix) pair of every word, storing the highest index seen so far (iteration in increasing index order makes overwrites automatic). Lookup then needs only one dictionary access; total build work is bounded by the sum of prefix-suffix pairs per word.', 'class WordFilter:\n    def __init__(self, words):\n        self.map = {}\n        for idx, w in enumerate(words):\n            for p in range(len(w) + 1):\n                for s in range(len(w) + 1):\n                    self.map[(w[:p], w[len(w) - s:])] = idx\n\n    def f(self, pref, suff):\n        return self.map.get((pref, suff), -1)', 'O(sum of word-length squared) build · O(1) query · O(prefix-suffix pairs) space'],
            'Sort an Array': ['Top-down merge sort: split the range in half, sort both halves recursively, then merge the two sorted runs into the original slice. Guaranteed O(n log n) in all cases, which is why it is the safe answer for the built-in-sort-free problem.', 'def sortArray(nums):\n    def sort_range(lo, hi):\n        if hi - lo <= 1:\n            return\n        mid = (lo + hi) // 2\n        sort_range(lo, mid)\n        sort_range(mid, hi)\n        left, right = nums[lo:mid], nums[mid:hi]\n        i = j = 0\n        k = lo\n        while i < len(left) and j < len(right):\n            if left[i] <= right[j]:\n                nums[k] = left[i]\n                i += 1\n            else:\n                nums[k] = right[j]\n                j += 1\n            k += 1\n        while i < len(left):\n            nums[k] = left[i]\n            i += 1\n            k += 1\n        while j < len(right):\n            nums[k] = right[j]\n            j += 1\n            k += 1\n\n    sort_range(0, len(nums))\n    return nums', 'O(n log n) time · O(n) space'],
            'Sort Colors': ['Dutch national flag partitioning with three pointers: a left wall for 0s, a right wall for 2s, and a scanning index. A 0 swaps with the left wall and both advance; a 2 swaps with the right wall without advancing the scanner (the swapped-in value is unexamined); a 1 just moves on.', 'def sortColors(nums):\n    l = 0\n    r = len(nums) - 1\n    i = 0\n    while i <= r:\n        if nums[i] == 0:\n            nums[l], nums[i] = nums[i], nums[l]\n            l += 1\n            i += 1\n        elif nums[i] == 2:\n            nums[r], nums[i] = nums[i], nums[r]\n            r -= 1\n        else:\n            i += 1', 'O(n) time · O(1) space'],
            'Wiggle Sort (LintCode)': ['To satisfy nums[0] <= nums[1] >= nums[2] <= ..., fix only the odd positions: each odd index must be a peak. Swapping an odd index with its left neighbour when smaller, and with its right neighbour when smaller, never breaks previously fixed positions, so one pass suffices.', 'def wiggleSort(nums):\n    for i in range(1, len(nums), 2):\n        if nums[i] < nums[i - 1]:\n            nums[i], nums[i - 1] = nums[i - 1], nums[i]\n        if i + 1 < len(nums) and nums[i] < nums[i + 1]:\n            nums[i], nums[i + 1] = nums[i + 1], nums[i]', 'O(n) time · O(1) space'],
            'Largest Number': ['Ordering the numbers by numeric value is wrong (9 must precede 34); instead compare concatenations: a should precede b when a+b is lexicographically larger than b+a. A custom comparator sorts this way, then the result is joined; all-zero input collapses to a single 0.', 'from functools import cmp_to_key\n\ndef largestNumber(nums):\n    def cmp(a, b):\n        if a + b > b + a:\n            return -1\n        if a + b < b + a:\n            return 1\n        return 0\n\n    strs = [str(x) for x in nums]\n    strs.sort(key=cmp_to_key(cmp))\n    res = \'\'.join(strs)\n    return \'0\' if res[0] == \'0\' else res', 'O(n log n) time · O(n) space'],
            'Maximum Gap': ['Pigeonhole principle: with n numbers in a range of width W, when they are bucketed into n-1 buckets of size at least W/(n-1), the maximum gap cannot occur inside a bucket, only between buckets. So store only each buckets min and max, then sweep the non-empty buckets and take the largest neighbouring gap.', 'def maximumGap(nums):\n    if len(nums) < 2:\n        return 0\n    lo, hi = min(nums), max(nums)\n    if lo == hi:\n        return 0\n    n = len(nums)\n    size = max(1, (hi - lo) // (n - 1))\n    nb = (hi - lo) // size + 1\n    buckets = [[] for _ in range(nb)]\n    for x in nums:\n        buckets[(x - lo) // size].append(x)\n    prev_hi = None\n    best = 0\n    for b in buckets:\n        if not b:\n            continue\n        if prev_hi is None:\n            prev_hi = max(b)\n            continue\n        best = max(best, min(b) - prev_hi)\n        prev_hi = max(b)\n    return best', 'O(n) time · O(n) space'],
        };
        Object.assign(custom, realSolutions);
        // ================= v2: 40 new problems =================
        const realSolutions2 = {
            'Median of Two Sorted Arrays': ['Binary-search the smaller array to find the correct split point of the merged array. At the split, every element of the left halves must be <= every element of the right halves; comparing A[i-1] vs B[j] and B[j-1] vs A[i] tells you which way to move, and the median falls out of the boundary values.', 'def findMedianSortedArrays(A, B):\n    if len(A) > len(B):\n        A, B = B, A\n    m, n = len(A), len(B)\n    lo, hi = 0, m\n    total = m + n\n    INF = float(\'inf\')\n    while lo <= hi:\n        i = (lo + hi) // 2\n        j = (total + 1) // 2 - i\n        a_l = A[i - 1] if i > 0 else -INF\n        a_r = A[i] if i < m else INF\n        b_l = B[j - 1] if j > 0 else -INF\n        b_r = B[j] if j < n else INF\n        if a_l > b_r:\n            hi = i - 1\n        elif b_l > a_r:\n            lo = i + 1\n        else:\n            if total % 2:\n                return max(a_l, b_l)\n            return (max(a_l, b_l) + min(a_r, b_r)) / 2.0', 'O(log min(m, n)) time · O(1) space'],
            'Longest Consecutive Sequence': ['Put every number in a set, then start a streak only at numbers that have no left neighbour (x-1 not in set). Walking right while consecutive numbers exist counts each streak once, so the whole scan is O(n) thanks to O(1) set lookups.', 'def longestConsecutive(nums):\n    s = set(nums)\n    best = 0\n    for x in s:\n        if x - 1 not in s:\n            length = 1\n            while x + length in s:\n                length += 1\n            best = max(best, length)\n    return best', 'O(n) time · O(n) space'],
            'Majority Element': ['Boyer-Moore voting: keep a candidate and a counter. Seeing the candidate increments the counter, any other value decrements it, and when the counter hits zero the next element becomes the candidate. Because the majority element appears more than n/2 times, it survives as the final candidate.', 'def majorityElement(nums):\n    cand = None\n    count = 0\n    for x in nums:\n        if count == 0:\n            cand = x\n        count += 1 if x == cand else -1\n    return cand', 'O(n) time · O(1) space'],
            'Add Two Numbers': ['Walk both lists together with a running carry, exactly like grade-school addition from least significant digit. The sum of two digits plus the carry decides the output digit; a leftover carry after both lists end creates one extra node.', 'def addTwoNumbers(l1, l2):\n    dummy = tail = ListNode()\n    carry = 0\n    while l1 or l2 or carry:\n        s = carry + (l1.val if l1 else 0) + (l2.val if l2 else 0)\n        carry = s // 10\n        tail.next = ListNode(s % 10)\n        tail = tail.next\n        if l1: l1 = l1.next\n        if l2: l2 = l2.next\n    return dummy.next', 'O(max(n, m)) time · O(max(n, m)) space'],
            'Intersection of Two Linked Lists': ['Two pointers walk the lists; when one reaches the end it continues from the other list\'s head. After at most len(A) + len(B) steps both pointers have travelled equal distance and meet exactly at the intersection node, or both reach None if no intersection exists.', 'def getIntersectionNode(headA, headB):\n    a, b = headA, headB\n    while a is not b:\n        a = a.next if a else headB\n        b = b.next if b else headA\n    return a', 'O(n + m) time · O(1) space'],
            'Copy List with Random Pointer': ['A deep copy needs old-to-new node correspondence because random pointers can point to any node. Pass one: build a dictionary mapping every original node to its copy. Pass two: set each copy\'s next and random by dictionary lookup, which preserves shared structure exactly.', 'def copyRandomList(head):\n    if not head:\n        return None\n    clone = {}\n    cur = head\n    while cur:\n        clone[cur] = Node(cur.val)\n        cur = cur.next\n    cur = head\n    while cur:\n        if cur.next:\n            clone[cur].next = clone[cur.next]\n        if cur.random:\n            clone[cur].random = clone[cur.random]\n        cur = cur.next\n    return clone[head]', 'O(n) time · O(n) space'],
            'Reverse Nodes in k-Group': ['Process one group at a time with a dummy node. First verify k nodes remain; then reverse the group with the standard three-pointer technique (prev, curr, next), re-link its head and tail into the outer list, and move the group pointer to the old head, which is now the tail of the reversed block.', 'def reverseKGroup(head, k):\n    dummy = ListNode(0, head)\n    group_prev = dummy\n    while True:\n        kth = group_prev\n        for _ in range(k):\n            if not kth.next:\n                return dummy.next\n            kth = kth.next\n        group_next = kth.next\n        prev, curr = kth.next, group_prev.next\n        while curr is not group_next:\n            nxt = curr.next\n            curr.next = prev\n            prev = curr\n            curr = nxt\n        old_head = group_prev.next\n        group_prev.next = kth\n        group_prev = old_head', 'O(n) time · O(1) space'],
            'Coin Change': ['Unbounded-knapsack style DP: dp[a] = fewest coins to make amount a. For each coin, every amount a >= coin updates dp[a] = min(dp[a], dp[a-coin] + 1), and iterating amounts upward lets the same coin be reused any number of times.', 'def coinChange(coins, amount):\n    dp = [amount + 1] * (amount + 1)\n    dp[0] = 0\n    for c in coins:\n        for a in range(c, amount + 1):\n            dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] <= amount else -1', 'O(coins * amount) time · O(amount) space'],
            'Decode Ways': ['dp[i] = ways to decode s[:i]. A single digit 1-9 always extends dp[i-1]; a two-digit 10-26 extends dp[i-2]. Leading zeros make those branches invalid, which the checks handle automatically, e.g. \'06\' yields 0 because neither \'0\' nor \'06\' is decodable.', 'def numDecodings(s):\n    n = len(s)\n    dp = [0] * (n + 1)\n    dp[0] = 1\n    dp[1] = 1 if s[0] != \'0\' else 0\n    for i in range(2, n + 1):\n        if s[i - 1] != \'0\':\n            dp[i] += dp[i - 1]\n        if 10 <= int(s[i - 2:i]) <= 26:\n            dp[i] += dp[i - 2]\n    return dp[n]', 'O(n) time · O(1) space'],
            'Partition Labels': ['Record each character\'s last occurrence. Walk the string extending the current segment\'s end to the farthest last occurrence seen inside it; when the walk reaches that end, the segment can safely close because no character inside appears later.', 'def partitionLabels(s):\n    last = {c: i for i, c in enumerate(s)}\n    res = []\n    start = end = 0\n    for i, c in enumerate(s):\n        end = max(end, last[c])\n        if i == end:\n            res.append(i - start + 1)\n            start = i + 1\n    return res', 'O(n) time · O(1) space'],
            'Candy': ['Each child needs more candy than a lower-rated neighbour on either side. One pass left-to-right guarantees the left rule, one pass right-to-left guarantees the right rule, and taking the maximum of both requirements per child satisfies them simultaneously with minimal total candy.', 'def candy(ratings):\n    n = len(ratings)\n    left = [1] * n\n    right = [1] * n\n    for i in range(1, n):\n        if ratings[i] > ratings[i - 1]:\n            left[i] = left[i - 1] + 1\n    for i in range(n - 2, -1, -1):\n        if ratings[i] > ratings[i + 1]:\n            right[i] = right[i + 1] + 1\n    return sum(max(a, b) for a, b in zip(left, right))', 'O(n) time · O(n) space'],
            'Car Fleet': ['A car merges into the fleet ahead only if it arrives no later than that fleet. Sort cars by position (nearest target first) and keep arrival times of fleet leaders in a stack: a car whose travel time is larger than the current leader starts a new fleet, otherwise it is absorbed.', 'def carFleet(target, position, speed):\n    cars = sorted(zip(position, speed), reverse=True)\n    fleets = []\n    for pos, sp in cars:\n        t = (target - pos) / sp\n        if not fleets or t > fleets[-1]:\n            fleets.append(t)\n    return len(fleets)', 'O(n log n) time · O(n) space'],
            'Basic Calculator': ['Evaluate with a sign stack: numbers accumulate into a running total with the current sign, parentheses push (total, sign) and restore them on exit. Normalizing leading/minus-after-paren forms first makes unary negatives like (-2) behave like 0 - 2.', 'def calculate(s):\n    s = s.replace(\'(-\', \'(0-\').replace(\'(+\', \'(0+\').replace(\'( -\', \'(0-\')\n    if s.startswith(\'-\'):\n        s = \'0\' + s\n    total = num = 0\n    sign = 1\n    stack = []\n    for c in s:\n        if c.isdigit():\n            num = num * 10 + int(c)\n        elif c == \'+\':\n            total += sign * num; num = 0; sign = 1\n        elif c == \'-\':\n            total += sign * num; num = 0; sign = -1\n        elif c == \'(\':\n            stack.append((total, sign)); total = 0; num = 0; sign = 1\n        elif c == \')\':\n            total += sign * num; num = 0\n            prev_total, prev_sign = stack.pop()\n            total = prev_total + prev_sign * total\n    return total + sign * num', 'O(n) time · O(n) space'],
            'Letter Combinations of a Phone Number': ['Iterative Cartesian product: start with the empty prefix and for every digit expand each existing prefix with every letter the digit maps to. Each expansion multiplies the list, so after all digits the result contains exactly all combinations in lexicographic order.', 'def letterCombinations(digits):\n    if not digits:\n        return []\n    m = {\'2\': \'abc\', \'3\': \'def\', \'4\': \'ghi\', \'5\': \'jkl\',\n         \'6\': \'mno\', \'7\': \'pqrs\', \'8\': \'tuv\', \'9\': \'wxyz\'}\n    res = [\'\']\n    for d in digits:\n        res = [p + c for p in res for c in m[d]]\n    return res', 'O(4^n * n) time · O(4^n) space'],
            'Palindrome Partitioning': ['Backtracking over cut points: at each position try every substring that is a palindrome, record it, and recurse on the remainder. Because every palindrome is tested as a potential cut and substrings are never cut mid-way, all valid partitions are enumerated without duplicates.', 'def partition(s):\n    res = []\n    def backtrack(start, path):\n        if start == len(s):\n            res.append(path[:])\n            return\n        for end in range(start, len(s)):\n            sub = s[start:end + 1]\n            if sub == sub[::-1]:\n                path.append(sub)\n                backtrack(end + 1, path)\n                path.pop()\n    backtrack(0, [])\n    return res', 'O(n * 2^n) time · O(n) space'],
            'N-Queens': ['Backtrack row by row; a queen is legal when its column, main diagonal (r-c) and anti-diagonal (r+c) are all unused. Placing a queen marks all three sets, and on failure the marks are undone, so every valid board is produced exactly once.', 'def solveNQueens(n):\n    res = []\n    board = [[\'.\'] * n for _ in range(n)]\n    cols, diag, anti = set(), set(), set()\n\n    def bt(r):\n        if r == n:\n            res.append([\'\'.join(row) for row in board])\n            return\n        for c in range(n):\n            if c in cols or (r - c) in diag or (r + c) in anti:\n                continue\n            cols.add(c); diag.add(r - c); anti.add(r + c)\n            board[r][c] = \'Q\'\n            bt(r + 1)\n            cols.remove(c); diag.remove(r - c); anti.remove(r + c)\n            board[r][c] = \'.\'\n\n    bt(0)\n    return res', 'O(n!) time · O(n) space'],
            'Binary Tree Maximum Path Sum': ['A path can bend only once, at some highest node, so compute bottom-up the best downward sum of each subtree (ignoring negative contributions) and combine left + node + right as a candidate path. The global maximum over all such bends is the answer.', 'def maxPathSum(root):\n    best = [float(\'-inf\')]\n\n    def dfs(node):\n        if not node:\n            return 0\n        left = max(0, dfs(node.left))\n        right = max(0, dfs(node.right))\n        best[0] = max(best[0], node.val + left + right)\n        return node.val + max(left, right)\n\n    dfs(root)\n    return best[0]', 'O(n) time · O(h) space'],
            'Lowest Common Ancestor of a Binary Tree': ['Recursion returns the LCA when found, or the node itself if it matches p or q. If both children report a match, the current node is the LCA; if only one side matches, that answer propagates up — an elegant single traversal with no parent pointers.', 'def lowestCommonAncestor(root, p, q):\n    if not root or root is p or root is q:\n        return root\n    left = lowestCommonAncestor(root.left, p, q)\n    right = lowestCommonAncestor(root.right, p, q)\n    if left and right:\n        return root\n    return left or right', 'O(n) time · O(h) space'],
            'Serialize and Deserialize Binary Tree': ['Preorder DFS with a null marker (e.g. #) encodes the tree uniquely as a comma-separated string. Deserialization replays the preorder sequence with an index pointer: read a value, build the node, then recursively build left and right children in that exact order.', 'def serialize(root):\n    def go(node):\n        if not node:\n            return [\'#\']\n        return [str(node.val)] + go(node.left) + go(node.right)\n    return \',\'.join(go(root))\n\ndef deserialize(data):\n    vals = iter(data.split(\',\'))\n    def go():\n        v = next(vals)\n        if v == \'#\':\n            return None\n        node = TreeNode(int(v))\n        node.left = go()\n        node.right = go()\n        return node\n    return go()', 'O(n) time · O(n) space'],
            'Subtree of Another Tree': ['A tree is a subtree if some node of the root is identical in structure and values to subRoot. Walk the root and compare each node against subRoot with the same-tree recursion; the identical check short-circuits on the first value or shape mismatch.', 'def isSubtree(root, subRoot):\n    if not subRoot:\n        return True\n\n    def same(a, b):\n        if not a and not b:\n            return True\n        if not a or not b or a.val != b.val:\n            return False\n        return same(a.left, b.left) and same(a.right, b.right)\n\n    stack = [root]\n    while stack:\n        node = stack.pop()\n        if not node:\n            continue\n        if node.val == subRoot.val and same(node, subRoot):\n            return True\n        stack.append(node.left)\n        stack.append(node.right)\n    return False', 'O(n * m) time · O(h) space'],
            'Count Good Nodes in Binary Tree': ['A node is good when its value is at least every value on the path from the root. DFS carrying the maximum seen so far: if the node value is >= that maximum it counts and becomes the new maximum for its children — one clean top-down pass.', 'def goodNodes(root):\n    count = 0\n\n    def dfs(node, mx):\n        nonlocal count\n        if not node:\n            return\n        if node.val >= mx:\n            count += 1\n            mx = node.val\n        dfs(node.left, mx)\n        dfs(node.right, mx)\n\n    dfs(root, -10**9)\n    return count', 'O(n) time · O(h) space'],
            'Binary Tree Level Order Traversal': ['BFS with a queue that holds whole levels: before expanding, the queue length is exactly the number of nodes in the current level, so popping that many nodes collects the level and enqueues only the next one.', 'from collections import deque\n\ndef levelOrder(root):\n    if not root:\n        return []\n    res = []\n    q = deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            level.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(level)\n    return res', 'O(n) time · O(n) space'],
            'Binary Tree Right Side View': ['Level-order BFS keeps only the last node of each level, which is exactly what the right side of the tree sees. Nodes are processed left to right per level, so the final value of each level is the rightmost visible node.', 'from collections import deque\n\ndef rightSideView(root):\n    if not root:\n        return []\n    res = []\n    q = deque([root])\n    while q:\n        level_size = len(q)\n        for i in range(level_size):\n            node = q.popleft()\n            if i == level_size - 1:\n                res.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n    return res', 'O(n) time · O(n) space'],
            'Binary Tree Zigzag Level Order Traversal': ['Standard level-order BFS, but track direction: after collecting a level, reverse it on every other row. Direction flips only between levels, and the flag toggling after each level produces the exact zigzag pattern.', 'from collections import deque\n\ndef zigzagLevelOrder(root):\n    if not root:\n        return []\n    res = []\n    q = deque([root])\n    left_to_right = True\n    while q:\n        level = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            level.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(level if left_to_right else level[::-1])\n        left_to_right = not left_to_right\n    return res', 'O(n) time · O(n) space'],
            'Vertical Order Traversal of a Binary Tree': ['BFS assigns every node a column offset (left child -1, right child +1) and a row depth. Group nodes by column; within a column sort by (row, value) — the row tie-break is what distinguishes this problem from plain column grouping.', 'from collections import deque, defaultdict\n\ndef verticalTraversal(root):\n    if not root:\n        return []\n    columns = defaultdict(list)\n    q = deque([(root, 0, 0)])      # node, row, column\n    while q:\n        node, row, col = q.popleft()\n        columns[col].append((row, node.val))\n        if node.left: q.append((node.left, row + 1, col - 1))\n        if node.right: q.append((node.right, row + 1, col + 1))\n    res = []\n    for col in sorted(columns):\n        columns[col].sort()        # by row, then value\n        res.append([v for _, v in columns[col]])\n    return res', 'O(n log n) time · O(n) space'],
            'Populating Next Right Pointers in Each Node': ['A perfect tree\'s level is traversed using next pointers already set on the level above. For each node: its left child points to its right child, and its right child points to the left child of the node\'s next — walking level by level with the leftmost node of each level.', 'def connect(root):\n    if not root:\n        return None\n    leftmost = root\n    while leftmost.left:\n        head = leftmost\n        while head:\n            head.left.next = head.right\n            if head.next:\n                head.right.next = head.next.left\n            head = head.next\n        leftmost = leftmost.left\n    return root', 'O(n) time · O(1) space'],
            'Integer to Roman': ['Greedy with a descending table of (value, symbol) pairs including the subtractive forms 900/CM, 400/CD, 90/XC, 40/XL, 9/IX, 4/IV. Repeating the largest symbol that fits guarantees the canonical Roman numeral with the fewest characters.', 'def intToRoman(num):\n    table = [(1000, \'M\'), (900, \'CM\'), (500, \'D\'), (400, \'CD\'),\n             (100, \'C\'), (90, \'XC\'), (50, \'L\'), (40, \'XL\'),\n             (10, \'X\'), (9, \'IX\'), (5, \'V\'), (4, \'IV\'), (1, \'I\')]\n    out = []\n    for value, symbol in table:\n        while num >= value:\n            out.append(symbol)\n            num -= value\n    return \'\'.join(out)', 'O(1) time · O(1) space'],
            'String to Integer (atoi)': ['Skip leading whitespace, read an optional sign, then accumulate digits until a non-digit ends the number. Clamping to the 32-bit signed range at the end replicates the language-level behaviour required by the problem.', 'def myAtoi(s):\n    s = s.lstrip()\n    if not s:\n        return 0\n    i = 0\n    sign = 1\n    if s[0] in \'+-\':\n        sign = -1 if s[0] == \'-\' else 1\n        i = 1\n    num = 0\n    while i < len(s) and s[i].isdigit():\n        num = num * 10 + int(s[i])\n        i += 1\n    num *= sign\n    return max(-2**31, min(num, 2**31 - 1))', 'O(n) time · O(1) space'],
            'Design Search Autocomplete System': ['Keep a frequency map of every sentence and the live prefix typed so far. Each input character narrows the candidate set to sentences starting with the prefix; ranking by (-frequency, sentence) and taking the top three reproduces the required autocomplete order.', 'class AutocompleteSystem:\n    def __init__(self, sentences, times):\n        self.counts = {}\n        for s, t in zip(sentences, times):\n            self.counts[s] = t\n        self.cur = \'\'\n\n    def input(self, c):\n        if c == \'#\':\n            self.counts[self.cur] = self.counts.get(self.cur, 0) + 1\n            self.cur = \'\'\n            return []\n        self.cur += c\n        cands = [s for s in self.counts if s.startswith(self.cur)]\n        cands.sort(key=lambda s: (-self.counts[s], s))\n        return cands[:3]', 'O(n log n) per input · O(total characters) space'],
            'Text Justification': ['Greedily pack as many words as fit on each line, then distribute the remaining spaces evenly between words (extra spaces go left-to-right). The last line is left-justified with single spaces and padded right — the two cases the problem explicitly distinguishes.', 'def fullJustify(words, maxWidth):\n    res = []\n    line, line_len = [], 0\n    for w in words:\n        if line_len + len(line) + len(w) > maxWidth:\n            spaces = maxWidth - line_len\n            if len(line) == 1:\n                res.append(line[0] + \' \' * spaces)\n            else:\n                gaps = len(line) - 1\n                base, extra = divmod(spaces, gaps)\n                row = \'\'\n                for i, word in enumerate(line):\n                    row += word\n                    if i < gaps:\n                        row += \' \' * (base + (1 if i < extra else 0))\n                res.append(row)\n            line, line_len = [w], len(w)\n        else:\n            line.append(w)\n            line_len += len(w)\n    last = \' \'.join(line)\n    res.append(last + \' \' * (maxWidth - len(last)))\n    return res', 'O(n * L) time · O(n) space'],
            'Critical Connections in a Network': ['Tarjan\'s bridge algorithm: a DFS numbering (disc) plus low-link values. An edge (u, v) is a bridge exactly when v\'s subtree cannot reach anything above u, i.e. low[v] > disc[u]; skipping only the direct parent keeps parallel-edge semantics correct.', 'import sys\nsys.setrecursionlimit(10**6)\n\ndef criticalConnections(n, connections):\n    graph = [[] for _ in range(n)]\n    for a, b in connections:\n        graph[a].append(b)\n        graph[b].append(a)\n    disc = [-1] * n\n    low = [0] * n\n    res = []\n    timer = 0\n\n    def dfs(u, parent):\n        nonlocal timer\n        disc[u] = low[u] = timer\n        timer += 1\n        for v in graph[u]:\n            if v == parent:\n                continue\n            if disc[v] == -1:\n                dfs(v, u)\n                low[u] = min(low[u], low[v])\n                if low[v] > disc[u]:\n                    res.append([u, v])\n            else:\n                low[u] = min(low[u], disc[v])\n\n    for i in range(n):\n        if disc[i] == -1:\n            dfs(i, -1)\n    return res', 'O(V + E) time · O(V + E) space'],
            'Linear Regression from Scratch': ['Minimize mean squared error with batch gradient descent: for each epoch compute the prediction error per sample, accumulate gradients of the loss with respect to the weights and bias, then take a step of size lr/n in the negative gradient direction until convergence.', 'def train_linear_regression(X, y, lr=0.01, epochs=1000):\n    n = len(X)\n    d = len(X[0])\n    w = [0.0] * d\n    b = 0.0\n    for _ in range(epochs):\n        dw = [0.0] * d\n        db = 0.0\n        for i in range(n):\n            pred = b + sum(w[k] * X[i][k] for k in range(d))\n            err = pred - y[i]\n            for k in range(d):\n                dw[k] += err * X[i][k]\n            db += err\n        for k in range(d):\n            w[k] -= lr * dw[k] / n\n        b -= lr * db / n\n    return w, b\n\ndef predict(X, w, b):\n    return [b + sum(w[k] * x[k] for k in range(len(w))) for x in X]', 'O(epochs * n * d) time · O(d) space'],
            'Logistic Regression from Scratch': ['Learn a linear decision boundary for binary classification by minimizing log loss with gradient descent. Each update uses the sigmoid probability error (prediction - label) times the feature — the same elegant gradient form as linear regression but with a squashed output.', 'import math\n\ndef sigmoid(z):\n    if z >= 0:\n        return 1 / (1 + math.exp(-z))\n    e = math.exp(z)\n    return e / (1 + e)          # stable for very negative z\n\ndef train_logistic_regression(X, y, lr=0.1, epochs=500):\n    n = len(X)\n    d = len(X[0])\n    w = [0.0] * d\n    b = 0.0\n    for _ in range(epochs):\n        dw = [0.0] * d\n        db = 0.0\n        for i in range(n):\n            z = b + sum(w[k] * X[i][k] for k in range(d))\n            p = sigmoid(z)\n            err = p - y[i]\n            for k in range(d):\n                dw[k] += err * X[i][k]\n            db += err\n        for k in range(d):\n            w[k] -= lr * dw[k] / n\n        b -= lr * db / n\n    return w, b\n\ndef predict_proba(X, w, b):\n    return [sigmoid(b + sum(w[k] * x[k] for k in range(len(w)))) for x in X]', 'O(epochs * n * d) time · O(d) space'],
